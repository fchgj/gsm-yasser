<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSM Yasser - iPhone IMEI Check</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .container { background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 460px; text-align: center; }
        .logo h2 { color: #1a1a1a; font-size: 24px; margin-bottom: 8px; }
        .logo p { color: #65676b; font-size: 14px; margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 13px; }
        input { width: 100%; padding: 14px; border: 1px solid #ccd0d5; border-radius: 10px; font-size: 16px; text-align: center; letter-spacing: 1px; transition: border-color 0.2s; }
        input:focus { border-color: #0084ff; outline: none; box-shadow: 0 0 0 3px rgba(0,132,255,0.1); }
        button { width: 100%; padding: 14px; background: #0084ff; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #006dd6; }
        button:disabled { background: #bcc0c4; cursor: not-allowed; }
        .result-box { margin-top: 20px; padding: 16px; border-radius: 10px; font-size: 14px; text-align: left; display: none; line-height: 1.6; }
        .success { background: #e7f3ff; color: #004085; border: 1px solid #b8daff; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .loading { background: #fff8e1; color: #f57f17; border: 1px solid #ffecb3; }
        .footer { margin-top: 20px; font-size: 12px; color: #8a8d91; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <h2>GSM Yasser</h2>
        <p>Smart iPhone IMEI Lookup Tool</p>
    </div>

    <div class="input-group">
        <label for="imeiInput">Enter 15-Digit IMEI:</label>
        <input type="text" id="imeiInput" placeholder="35XXXXXXXXXXXXXXXXX" maxlength="15" autocomplete="off">
    </div>

    <button id="searchBtn" onclick="checkImei()">Check Device Now</button>

    <div id="resultBox" class="result-box"></div>

    <div class="footer">
        GSM Yasser Server &copy; 2026
    </div>
</div>

<script>
    // 🔑 Insert your personal API key here once received to activate direct connection[span_1](start_span)[span_1](end_span)
    const PERSONAL_API_KEY = ""; 

    async function checkImei() {
        const imeiInput = document.getElementById('imeiInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultBox = document.getElementById('resultBox');
        const imei = imeiInput.value.trim();

        // 1. Validate 15 digits requirement
        if (imei.length !== 15 || isNaN(imei)) {
            showResult('❌ Please enter a valid 15-digit IMEI number.', 'error');
            return;
        }

        // 2. Temporarily disable search button to prevent spamming
        searchBtn.disabled = true;
        showResult('⏳ Checking IMEI and querying database...', 'loading');

        // Build the API URL with or without the API key
        let apiUrl = `https://alpha.imeicheck.com/api/modelBrandName?imei=${imei}&format=json`;
        if (PERSONAL_API_KEY) {
            apiUrl += `&key=${PERSONAL_API_KEY}`;
        }

        try {
            const response = await fetch(apiUrl);
            
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }

            const data = await response.json();

            // 3. Extract data
            const brand = (data.brand || '').toLowerCase();
            const model = data.model || 'iPhone (Model unspecified)';

            // 4. Strict Apple/iPhone filtering
            if (brand.includes('apple') || model.toLowerCase().includes('iphone')) {
                showResult(`
                    <b>✅ Verification Successful (Compatible iPhone):</b><br>
                    • <b>Brand:</b> Apple<br>
                    • <b>Model:</b> ${model}<br>
                    • <b>IMEI:</b> ${imei}
                `, 'success');
            } else if (data.brand) {
                showResult(`⚠️ Sorry, this device belongs to (${data.brand}). GSM Yasser is exclusively dedicated to <b>iPhone</b> devices.`, 'error');
            } else {
                showResult('⚠️ No matching records found for this IMEI. Please verify the number.', 'error');
            }

        } catch (error) {
            showResult(`
                <b>🛠️ Tool Ready - Awaiting API Integration:</b><br>
                • Entered IMEI: <b>${imei}</b><br>
                <span style="font-size: 12px; color: #555;">(Waiting to insert your free personal API key to bypass security limits and fetch live results directly)[span_2](start_span)[span_2](end_span).</span>
            `, 'loading');
            console.error('API Error / Pending Key:', error);
        } finally {
            // Re-enable button after 3 seconds
            setTimeout(() => {
                searchBtn.disabled = false;
            }, 3000);
        }
    }

    function showResult(message, type) {
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        resultBox.className = `result-box ${type}`;
        resultBox.innerHTML = message;
    }
</script>

</body>
</html>
