<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Title that will show in Google -->
<title>GSM YASSER SERVER - Free iPhone IMEI Check | GSM Yasser Oran</title>

<!-- Description that will show under title in Google -->
<meta name="description" content="Free iPhone and Samsung IMEI check. Check model, warranty and iOS version. GSM Yasser Server Oran - Fast and free IMEI check.">

<!-- For Facebook preview -->
<meta property="og:title" content="GSM YASSER SERVER - Free iPhone IMEI Check">
<meta property="og:description" content="Free iPhone and Samsung IMEI check. Check model, warranty and iOS version.">
<meta property="og:type" content="website">

<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px;margin:0}
.box{background:white;color:black;max-width:450px;margin:20px auto;padding:25px;border-radius:20px}
h1{color:#2563eb;font-size:26px;margin-bottom:5px}
p{color:#555}
input{width:90%;padding:15px;font-size:18px;text-align:center;border:2px solid #ddd;border-radius:10px;margin:10px 0}
button{width:95%;padding:15px;background:#2563eb;color:white;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer}
button:hover{background:#1d4ed8}
#result{margin-top:15px;padding:15px;background:#f1f5f9;border-radius:10px;display:none;text-align:left}
.badge{background:#22c55e;color:white;padding:5px 10px;border-radius:20px;font-size:13px}
.footer{margin-top:20px;color:#94a3b8;font-size:14px}
</style>
</head>
<body>

<h1>GSM YASSER SERVER</h1>
<p style="color:#cbd5e1">Free IMEI Check - iPhone & Samsung</p>

<div class="box">
<h2>Check Your Phone Now - Free ✅</h2>
<p>Enter your IMEI (15 digits) - Dial *#06# to get it</p>

<input type="text" id="imei" placeholder="Example: 354678901234567" maxlength="15">
<br>
<button onclick="checkIMEI()">Check Now - Free</button>

<div id="result"></div>

<p style="font-size:13px;color:#888">Basic check is free - For full report contact us in store</p>
</div>

<div class="footer">
<b>GSM Yasser - Oran</b><br>
Fast & Trusted Service in Store<br>
Follow us on Facebook: GSM YASSER SERVER
</div>

<script>
function checkIMEI(){
  var imei = document.getElementById('imei').value;
  var res = document.getElementById('result');
  if(imei.length !== 15){
    res.style.display='block';
    res.innerHTML = '<b style="color:red">⚠️ Please enter full 15 digits</b><br>Dial *#06# on your phone and copy the number here';
    return;
  }
  var tac = imei.substring(0,8);
  res.style.display='block';
  res.innerHTML = '<span class="badge">Checked Successfully ✅</span><br><br>' +
  '<b>IMEI:</b> ' + imei + '<br>' +
  '<b>TAC:</b> ' + tac + '<br>' +
  '<b>Status:</b> Number format is valid<br><br>' +
  '<b>For Full Info:</b> Model, Warranty, iOS Version, iCloud Status<br>' +
  'Contact us in store or in DM for full report.';
}
</script>

</body>
</html>
