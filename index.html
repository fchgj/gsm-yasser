<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMEI Check - Unlock & Check</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;margin:0;padding:20px;text-align:center}
.container{max-width:600px;margin:auto;background:#1e293b;padding:25px;border-radius:15px}
h1{color:#38bdf8}
input{width:90%;padding:12px;border-radius:10px;border:none;margin:10px 0;font-size:16px;text-align:center}
button{padding:12px 20px;border:none;border-radius:10px;background:#38bdf8;color:#fff;font-weight:bold;cursor:pointer;margin:5px;width:90%;font-size:16px}
button:hover{background:#0284c7}
.result{margin-top:15px;background:#0f172a;padding:15px;border-radius:10px;display:none;text-align:left}
.card{background:#334155;padding:15px;border-radius:10px;margin:10px 0}
.price{color:#4ade80;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div class="container">
<h1>🔓 IMEI CHECK</h1>
<p>Check your device - Free & Paid Services</p>

<h3>Free Check</h3>
<input type="text" id="imeiInput" placeholder="Enter IMEI - 15 digits" maxlength="15">
<button onclick="freeCheck(event)">Check For Free</button>
<div id="freeResult" class="result"></div>

<hr>

<h3>Paid Services</h3>
<div class="card">
<b>iCloud / Activation Lock Check</b><br>
<span class="price">500 DA</span><br>
<button onclick="paidCheck('iCloud Check',500)">Buy Now</button>
</div>

<div class="card">
<b>Carrier / SIM Lock Check</b><br>
<span class="price">500 DA</span><br>
<button onclick="paidCheck('Carrier Check',500)">Buy Now</button>
</div>

<div class="card">
<b>Blacklist / Stolen Check</b><br>
<span class="price">500 DA</span><br>
<button onclick="paidCheck('Blacklist Check',500)">Buy Now</button>
</div>

<div class="card">
<b>Full Report</b><br>
<span class="price">1000 DA</span><br>
<button onclick="paidCheck('Full Report',1000)">Buy Now</button>
</div>

<div id="paidResult" class="result"></div>

<h3>My Orders</h3>
<div id="ordersList"></div>

</div>

<script>
const IMEI_API_KEY = 'KHDOY-F8R1W-A9N0M-QM2L8-V7TZP-X4KEJ';

function saveOrder(service, imei){
  let orders = JSON.parse(localStorage.getItem('orders') || '[]');
  orders.push({service: service, imei: imei, date: new Date().toLocaleString()});
  localStorage.setItem('orders', JSON.stringify(orders));
  showOrders();
}

function showOrders(){
  let orders = JSON.parse(localStorage.getItem('orders') || '[]');
  let el = document.getElementById('ordersList');
  if(orders.length === 0){ el.innerHTML = '<p>No orders yet</p>'; return; }
  el.innerHTML = orders.map(o => '<div style="background:#0f172a;padding:10px;margin:5px;border-radius:8px;text-align:left">✅ '+o.service+' - '+o.imei+'<br><small>'+o.date+'</small></div>').join('');
}

function freeCheck(e){
  if(e) e.preventDefault();
  let v = document.getElementById('imeiInput').value.trim();
  let box = document.getElementById('freeResult');
  box.style.display = 'block';
  if(v.length < 15 || isNaN(v)){
    box.innerHTML = '❌ Invalid IMEI - Must be 15 digits';
    return;
  }
  box.innerHTML = '⏳ Checking real IMEI...';
  fetch('https://alpha.imeicheck.com/api/free_with_key/modelBrandName?key=' + IMEI_API_KEY + '&imei=' + v)
  .then(r => r.json())
  .then(d => {
    console.log('API Response:', d);
    let data = d.data || d.result || d.response || d;
    let brand = data.brand || data.Brand || data.manufacturer || data.Manufacturer || data.make || data.Make || data.brandName || 'Unknown';
    let model = data.model || data.Model || data.modelName || data.ModelName || data.device || data.Device || data.deviceName || '';
    if(brand === 'Unknown' && !model){
      box.innerHTML = '⚠️ IMEI Not Found in Database<br>IMEI: ' + v + '<br><small>Debug: ' + JSON.stringify(d).slice(0,300) + '</small>';
    } else {
      box.innerHTML = '✅ <b>' + brand + ' ' + model + '</b><br>IMEI: ' + v + '<br>Device is Original - TAC Registered';
    }
    saveOrder('Free Check', v);
  })
  .catch(err => {
    box.innerHTML = '❌ Connection Error - Please try again';
    console.log(err);
  });
}

function paidCheck(service, price){
  let v = document.getElementById('imeiInput').value.trim();
  let box = document.getElementById('paidResult');
  box.style.display = 'block';
  if(v.length < 15 || isNaN(v)){
    box.innerHTML = '❌ Please enter valid IMEI first (15 digits)';
    return;
  }
  box.innerHTML = '✅ Order Created: ' + service + ' - ' + price + ' DA<br>IMEI: ' + v + '<br>Please contact us on WhatsApp to pay and receive result.';
  saveOrder(service, v);
  window.open('https://wa.me/213657241710?text=Hello, I want ' + encodeURIComponent(service) + ' for IMEI ' + v, '_blank');
}

showOrders();
</script>
</body>
</html>
