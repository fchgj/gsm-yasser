<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GSMYasser Server - استعلام بيانات iPhone عبر IMEI</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --ok: #22c55e;
      --err: #ef4444;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0284c7;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px;
      flex: 1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .brand {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent);
      text-decoration: none;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    select, button, input {
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    select, button {
      background: var(--surface);
      color: var(--text);
      padding: 8px 12px;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      font-weight: 700;
      padding: 12px 18px;
    }

    button.primary:hover {
      opacity: 0.92;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.55rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      background: var(--surface-2);
      color: var(--text);
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .msg {
      margin-top: 12px;
      font-size: 0.9rem;
    }

    .msg.err { color: var(--err); }
    .msg.ok { color: var(--ok); }

    .result-box {
      display: none;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin: 14px 0;
    }

    .item {
      background: var(--surface-2);
      padding: 12px;
      border-radius: 10px;
    }

    .item span {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .item strong {
      font-size: 1rem;
    }

    footer {
      text-align: center;
      padding: 20px 12px;
      margin-top: 30px;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--muted);
    }

    footer a {
      color: inherit;
      text-decoration: none;
      margin: 0 8px;
    }

    footer a:hover {
      color: var(--accent);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="index.html" class="brand" id="brandName">GSMYasser Server</a>
      <div class="controls">
        <select id="langSelect" aria-label="Language">
          <option value="ar">العربية</option>
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>

        <select id="currencySelect" aria-label="Currency">
          <option value="DZD">DZD</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
        </select>

        <button type="button" id="themeBtn">🌓</button>
      </div>
    </header>

    <main class="card">
      <h1 id="pageTitle">استعلام بيانات ومعلومات iPhone عبر IMEI</h1>
      <p class="subtitle" id="pageSubtitle">أداة مخصصة لفحص وعرض معلومات هواتف iPhone برقم IMEI المكون من 15 رقماً.</p>

      <form id="imeiForm" class="form-row">
        <input
          type="text"
          id="imeiInput"
          maxlength="15"
          inputmode="numeric"
          placeholder="أدخل رقم IMEI (15 رقماً)..."
          required
        />
        <button type="submit" class="primary" id="checkBtn">فحص الجهاز</button>
      </form>

      <div id="statusMsg" class="msg"></div>

      <div id="resultBox" class="result-box">
        <h2 id="resultHeading">ملخص الاستعلام</h2>
        <div class="result-grid">
          <div class="item">
            <span id="lblImei">رقم IMEI</span>
            <strong id="valImei">-</strong>
          </div>
          <div class="item">
            <span id="lblDevice">الفئة المستهدفة</span>
            <strong id="valDevice">iPhone</strong>
          </div>
          <div class="item">
            <span id="lblPrice">التقدير السعري</span>
            <strong id="valPrice">-</strong>
          </div>
        </div>
        <button type="button" id="waBtn">تواصل عبر واتساب</button>
      </div>
    </main>
  </div>

  <footer>
    <div>
      <a href="legal.html#privacy" id="linkPrivacy">سياسة الخصوصية</a> |
      <a href="legal.html#terms" id="linkTerms">شروط الاستخدام</a> |
      <a href="legal.html#disclaimer" id="linkDisclaimer">إخلاء المسؤولية</a>
    </div>
    <div style="margin-top: 8px; font-size: 0.8rem;">
      © 2026 GSMYasser Server
    </div>
  </footer>

  <script>
    const i18n = {
      ar: {
        dir: "rtl",
        title: "استعلام بيانات ومعلومات iPhone عبر IMEI",
        subtitle: "أداة مخصصة لفحص وعرض معلومات هواتف iPhone برقم IMEI المكون من 15 رقماً.",
        placeholder: "أدخل رقم IMEI (15 رقماً)...",
        checkBtn: "فحص الجهاز",
        invalidImei: "يرجى إدخال رقم IMEI صحيح مكوّن من 15 رقماً.",
        validImei: "تم التحقق من صيغة رقم IMEI بنجاح.",
        resultHeading: "ملخص الاستعلام",
        lblImei: "رقم IMEI",
        lblDevice: "الفئة المستهدفة",
        lblPrice: "التقدير السعري",
        waBtn: "تواصل عبر واتساب",
        privacy: "سياسة الخصوصية",
        terms: "شروط الاستخدام",
        disclaimer: "إخلاء المسؤولية"
      },
      fr: {
        dir: "ltr",
        title: "Vérification des informations iPhone par IMEI",
        subtitle: "Outil dédié à la consultation des informations iPhone via l'IMEI à 15 chiffres.",
        placeholder: "Entrez l'IMEI (15 chiffres)...",
        checkBtn: "Vérifier",
        invalidImei: "Veuillez saisir un numéro IMEI valide à 15 chiffres.",
        validImei: "Format IMEI valide.",
        resultHeading: "Résumé de la requête",
        lblImei: "Numéro IMEI",
        lblDevice: "Catégorie",
        lblPrice: "Estimation tarifaire",
        waBtn: "Contacter sur WhatsApp",
        privacy: "Politique de confidentialité",
        terms: "Conditions d'utilisation",
        disclaimer: "Clause de non-responsabilité"
      },
      en: {
        dir: "ltr",
        title: "iPhone Information Lookup by IMEI",
        subtitle: "Tool dedicated to checking iPhone details using a 15-digit IMEI number.",
        placeholder: "Enter 15-digit IMEI...",
        checkBtn: "Check Device",
        invalidImei: "Please enter a valid 15-digit IMEI number.",
        validImei: "IMEI format is valid.",
        resultHeading: "Lookup Summary",
        lblImei: "IMEI Number",
        lblDevice: "Target Category",
        lblPrice: "Estimated Rate",
        waBtn: "Contact on WhatsApp",
        privacy: "Privacy Policy",
        terms: "Terms of Use",
        disclaimer: "Disclaimer"
      }
    };

    const rates = { DZD: "200 DZD", USD: "1.50 USD", EUR: "1.40 EUR" };

    const langSelect = document.getElementById("langSelect");
    const currencySelect = document.getElementById("currencySelect");
    const themeBtn = document.getElementById("themeBtn");
    const imeiForm = document.getElementById("imeiForm");
    const imeiInput = document.getElementById("imeiInput");
    const statusMsg = document.getElementById("statusMsg");
    const resultBox = document.getElementById("resultBox");
    const valImei = document.getElementById("valImei");
    const valPrice = document.getElementById("valPrice");
    const waBtn = document.getElementById("waBtn");

    function applyLanguage(lang) {
      const t = i18n[lang] || i18n.ar;
      document.documentElement.lang = lang;
      document.documentElement.dir = t.dir;
      document.getElementById("pageTitle").textContent = t.title;
      document.getElementById("pageSubtitle").textContent = t.subtitle;
      imeiInput.placeholder = t.placeholder;
      document.getElementById("checkBtn").textContent = t.checkBtn;
      document.getElementById("resultHeading").textContent = t.resultHeading;
      document.getElementById("lblImei").textContent = t.lblImei;
      document.getElementById("lblDevice").textContent = t.lblDevice;
      document.getElementById("lblPrice").textContent = t.lblPrice;
      waBtn.textContent = t.waBtn;
      document.getElementById("linkPrivacy").textContent = t.privacy;
      document.getElementById("linkTerms").textContent = t.terms;
      document.getElementById("linkDisclaimer").textContent = t.disclaimer;
      localStorage.setItem("gsm_yasser_lang", lang);
    }

    function applyCurrency(curr) {
      valPrice.textContent = rates[curr] || rates.DZD;
      localStorage.setItem("gsm_yasser_curr", curr);
    }

    function isValidLuhn(imei) {
      let sum = 0;
      for (let i = 0; i < imei.length; i++) {
        let digit = parseInt(imei[i], 10);
        if (i % 2 === 1) {
          digit *= 2;
          if (digit > 9) digit -= 9;
        }
        sum += digit;
      }
      return sum % 10 === 0;
    }

    langSelect.addEventListener("change", (e) => applyLanguage(e.target.value));
    currencySelect.addEventListener("change", (e) => applyCurrency(e.target.value));

    themeBtn.addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("gsm_yasser_theme", next);
    });

    imeiForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const lang = langSelect.value;
      const t = i18n[lang] || i18n.ar;
      const clean = imeiInput.value.replace(/\D/g, "");

      if (clean.length !== 15 || !isValidLuhn(clean)) {
        statusMsg.textContent = t.invalidImei;
        statusMsg.className = "msg err";
        resultBox.style.display = "none";
        return;
      }

      statusMsg.textContent = t.validImei;
      statusMsg.className = "msg ok";
      valImei.textContent = clean;
      applyCurrency(currencySelect.value);
      resultBox.style.display = "block";
    });

    waBtn.addEventListener("click", () => {
      const imei = valImei.textContent;
      const text = encodeURIComponent(`GSMYasser Server - iPhone IMEI: ${imei}`);
      window.open(`https://wa.me/?text=${text}`, "_blank", "noopener");
    });

    // استرجاع الإعدادات المحفوظة
    const savedTheme = localStorage.getItem("gsm_yasser_theme");
    if (savedTheme === "light" || savedTheme === "dark") {
      document.documentElement.setAttribute("data-theme", savedTheme);
    }

    const savedLang = localStorage.getItem("gsm_yasser_lang") || "ar";
    langSelect.value = savedLang;
    applyLanguage(savedLang);

    const savedCurr = localStorage.getItem("gsm_yasser_curr") || "DZD";
    currencySelect.value = savedCurr;
    applyCurrency(savedCurr);
  </script>
</body>
</html>
