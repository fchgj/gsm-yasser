<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSM Yasser Server - Official IMEI Checker & Services</title>
  <style>
    :root {
      --primary: #102b55;
      --secondary: #194382;
      --bg: #f8fafc;
      --text: #172033;
      --border: #ccd3df;
    }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    h1 { color: var(--primary); margin: 0; font-size: 22px; }
    .lang-switcher select {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button:hover { background: var(--secondary); }
    .btn-whatsapp { background: #25d366; }
    .btn-danger { background: #dc3545; }
    .admin-trigger {
      text-align: center;
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px dashed var(--border);
    }
    #gy-admin {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid var(--primary);
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #28a745;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- رأس الصفحة وزر تغيير اللغة -->
  <div class="header-bar">
    <h1 id="txt-brand">GSM Yasser Server</h1>
    <div class="lang-switcher">
      <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="en">English 🇬🇧</option>
        <option value="ar">العربية 🇩🇿</option>
        <option value="fr">Français 🇫🇷</option>
      </select>
    </div>
  </div>

  <!-- قسم الفحص المجاني الأساسي -->
  <div id="free-checker-section">
    <p id="txt-free-desc" style="color: #555; font-size: 14px;">Enter your iPhone IMEI below for quick device verification:</p>
    
    <div class="form-group">
      <label id="lbl-imei">IMEI Number (15 Digits)</label>
      <input type="text" id="freeIMEI" maxlength="15" placeholder="Enter 15-digit IMEI">
    </div>

    <button type="button" onclick="checkFreeIMEI()" id="btn-check">Check Device</button>
    <div id="freeResult" style="margin-top: 15px; font-weight: bold;"></div>
  </div>

  <!-- زر الدخول للوحة الإدارة السرية -->
  <div class="admin-trigger">
    <button type="button" onclick="GYAdmin.login()" style="background: #475569; width: auto; padding: 8px 20px; font-size: 13px;">
      🔐 Admin Panel Login
    </button>
  </div>

  <!-- لوحة الإدارة المدفوعة (محمية بكلمة المرور) -->
  <section id="gy-admin">
    <h3 style="color: var(--primary); text-align: center;" id="txt-admin-title">Paid Report & Admin Panel</h3>

    <div class="form-group">
      <label id="lbl-phone">Customer WhatsApp</label>
      <input id="gy-phone" type="tel" placeholder="+213XXXXXXXXX">
    </div>

    <div class="form-group">
      <label id="lbl-admin-imei">IMEI (15 Digits)</label>
      <input id="gy-imei" maxlength="15" inputmode="numeric" placeholder="15-digit IMEI">
    </div>

    <div class="form-group">
      <label id="lbl-model">Device Model</label>
      <input id="gy-model" placeholder="e.g. iPhone 14 Pro Max">
    </div>

    <div class="form-group">
      <label id="lbl-icloud">iCloud / FMI Status</label>
      <select id="gy-icloud">
        <option value="Not Checked">Not Checked</option>
        <option value="OFF">OFF (Clean / Available)</option>
        <option value="ON">ON (Lost / Locked)</option>
      </select>
    </div>

    <div class="form-group">
      <label id="lbl-carrier">Carrier / Network</label>
      <select id="gy-carrier">
        <option value="Not Checked">Not Checked</option>
        <option value="Factory Unlocked">Factory Unlocked</option>
        <option value="Locked">Locked</option>
      </select>
    </div>

    <div class="form-group">
      <label id="lbl-blacklist">GSMA Blacklist</label>
      <select id="gy-blacklist">
        <option value="Not Checked">Not Checked</option>
        <option value="Clean">Clean</option>
        <option value="Blacklisted">Blacklisted</option>
      </select>
    </div>

    <div class="form-group">
      <label id="lbl-mdm">MDM Status</label>
      <select id="gy-mdm">
        <option value="Not Checked">Not Checked</option>
        <option value="ON">ON (Enrolled)</option>
        <option value="OFF">OFF (Clean)</option>
      </select>
    </div>

    <div class="form-group">
      <label id="lbl-notes">Additional Notes</label>
      <textarea id="gy-notes" rows="3" placeholder="Optional notes for customer..."></textarea>
    </div>

    <button type="button" onclick="GYAdmin.generatePDF()" id="btn-gen">🖨️ Generate & Download PDF Report</button>
    <button type="button" class="btn-whatsapp" onclick="GYAdmin.sendWhatsApp()" id="btn-wa">💬 Send via WhatsApp</button>
    <button type="button" class="btn-danger" onclick="GYAdmin.logout()" id="btn-logout">🔒 Logout</button>

    <div id="gy-status" class="status"></div>
  </section>
</div>

<script>
  // نظام الترجمة والنصوص (الإنجليزية افتراضياً، مع العربية والفرنسية)
  const translations = {
    en: {
      brand: "GSM Yasser Server",
      freeDesc: "Enter your iPhone IMEI below for quick device verification:",
      lblImei: "IMEI Number (15 Digits)",
      btnCheck: "Check Device",
      adminTitle: "Paid Report & Admin Panel",
      lblPhone: "Customer WhatsApp",
      lblAdminImei: "IMEI (15 Digits)",
      lblModel: "Device Model",
      lblIcloud: "iCloud / FMI Status",
      lblCarrier: "Carrier / Network",
      lblBlacklist: "GSMA Blacklist",
      lblMdm: "MDM Status",
      lblNotes: "Additional Notes",
      btnGen: "🖨️ Generate & Download PDF Report",
      btnWa: "💬 Send via WhatsApp",
      btnLogout: "🔒 Logout",
      alertInvalidImei: "Please enter a valid 15-digit IMEI.",
      alertPassword: "Enter admin password:",
      alertWrongPass: "Incorrect password!",
      reportTitle: "iPhone Official Check Report"
    },
    ar: {
      brand: "سيرفر GSM Yasser",
      freeDesc: "أدخل رقم الـ IMEI الخاص بجهازك أدناه للتحقق السريع:",
      lblImei: "رقم IMEI (15 رقماً)",
      btnCheck: "فحص الجهاز",
      adminTitle: "لوحة تحكم التقارير المدفوعة",
      lblPhone: "رقم واتساب العميل",
      lblAdminImei: "رقم IMEI (15 رقماً)",
      lblModel: "موديل الجهاز",
      lblIcloud: "حالة الأيكلاود / FMI",
      lblCarrier: "الشبكة / شركة الاتصالات",
      lblBlacklist: "القائمة السوداء GSMA",
      lblMdm: "حالة MDM",
      lblNotes: "ملاحظات إضافية",
      btnGen: "🖨️ إصدار وتحميل تقرير PDF",
      btnWa: "💬 إرسال عبر واتساب",
      btnLogout: "🔒 تسجيل الخروج",
      alertInvalidImei: "الرجاء إدخال رقم IMEI صحيح يتكون من 15 رقماً.",
      alertPassword: "أدخل كلمة مرور المشرف:",
      alertWrongPass: "كلمة المرور غير صحيحة!",
      reportTitle: "تقرير فحص آيفون الرسمي"
    },
    fr: {
      brand: "GSM Yasser Server",
      freeDesc: "Entrez votre IMEI iPhone ci-dessous pour une vérification rapide :",
      lblImei: "Numéro IMEI (15 chiffres)",
      btnCheck: "Vérifier l'appareil",
      adminTitle: "Panneau d'administration des rapports",
      lblPhone: "WhatsApp du client",
      lblAdminImei: "IMEI (15 chiffres)",
      lblModel: "Modèle de l'appareil",
      lblIcloud: "Statut iCloud / FMI",
      lblCarrier: "Opérateur / Réseau",
      lblBlacklist: "Liste noire GSMA",
      lblMdm: "Statut MDM",
      lblNotes: "Remarques supplémentaires",
      btnGen: "🖨️ Générer et télécharger le rapport PDF",
      btnWa: "💬 Envoyer via WhatsApp",
      btnLogout: "🔒 Déconnexion",
      alertInvalidImei: "Veuillez entrer un IMEI valide à 15 chiffres.",
      alertPassword: "Entrez le mot de passe admin :",
      alertWrongPass: "Mot de passe incorrect !",
      reportTitle: "Rapport de vérification iPhone"
    }
  };

  function changeLanguage(lang) {
    const t = translations[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

    document.getElementById('txt-brand').innerText = t.brand;
    document.getElementById('txt-free-desc').innerText = t.freeDesc;
    document.getElementById('lbl-imei').innerText = t.lblImei;
    document.getElementById('btn-check').innerText = t.btnCheck;
    document.getElementById('txt-admin-title').innerText = t.adminTitle;
    document.getElementById('lbl-phone').innerText = t.lblPhone;
    document.getElementById('lbl-admin-imei').innerText = t.lblAdminImei;
    document.getElementById('lbl-model').innerText = t.lblModel;
    document.getElementById('lbl-icloud').innerText = t.lblIcloud;
    document.getElementById('lbl-carrier').innerText = t.lblCarrier;
    document.getElementById('lbl-blacklist').innerText = t.lblBlacklist;
    document.getElementById('lbl-mdm').innerText = t.lblMdm;
    document.getElementById('lbl-notes').innerText = t.lblNotes;
    document.getElementById('btn-gen').innerText = t.btnGen;
    document.getElementById('btn-wa').innerText = t.btnWa;
    document.getElementById('btn-logout').innerText = t.btnLogout;
  }

  // محاكاة الفحص المجاني الأساسي
  function checkFreeIMEI() {
    const imei = document.getElementById('freeIMEI').value.trim();
    const lang = document.getElementById('langSelect').value;
    const t = translations[lang];

    if (!/^\d{15}$/.test(imei)) {
      alert(t.alertInvalidImei);
      return;
    }
    document.getElementById('freeResult').innerHTML = lang === 'ar' 
      ? '✅ الـ IMEI صالح. يتم توجيهك لخدمات الفحص الشامل...' 
      : (lang === 'fr' ? '✅ IMEI valide. Redirection vers les services...' : '✅ Valid IMEI format. Ready for check.');
  }

  // لوحة الإدارة السرية والتقارير
  const GYAdmin = (() => {
    const SECRET_PASSWORD = "wP5t5B3d.";
    let report = null;
    const $ = id => document.getElementById(id);

    function login() {
      const lang = $('langSelect').value;
      const t = translations[lang];
      const password = prompt(t.alertPassword);
      if (password === null) return;

      if (password !== SECRET_PASSWORD) {
        alert(t.alertWrongPass);
        return;
      }

      $('gy-admin').style.display = 'block';
    }

    function logout() {
      $('gy-admin').style.display = 'none';
      report = null;
    }

    function generatePDF() {
      const lang = $('langSelect').value;
      const t = translations[lang];
      const imei = $('gy-imei').value.trim();

      if (!/^\d{15}$/.test(imei)) {
        alert(t.alertInvalidImei);
        return;
      }

      const model = $('gy-model').value || "Not Checked";
      const icloud = $('gy-icloud').value;
      const carrier = $('gy-carrier').value;
      const blacklist = $('gy-blacklist').value;
      const mdm = $('gy-mdm').value;
      const notes = $('gy-notes').value || "-";
      const ref = "GYS-" + Date.now();

      report = {
        imei, model, icloud, carrier, blacklist, mdm, notes, ref,
        phone: $('gy-phone').value.trim(),
        lang
      };

      const html = `<!DOCTYPE html>
      <html lang="${lang}" dir="${lang === 'ar' ? 'rtl' : 'ltr'}">
      <head>
        <meta charset="UTF-8">
        <title>${t.reportTitle}</title>
        <style>
          body { font-family: Arial, sans-serif; padding: 30px; color: #172033; }
          h1 { color: #102b55; text-align: center; }
          table { width: 100%; border-collapse: collapse; margin-top: 20px; }
          th, td { border: 1px solid #ccd3df; padding: 12px; text-align: start; }
          th { background: #eef2f7; width: 35%; }
          @media print { button { display: none; } }
        </style>
      </head>
      <body>
        <h1>GSM Yasser Server</h1>
        <h2 style="text-align:center;">${t.reportTitle}</h2>
        <p><strong>Reference:</strong> ${ref}</p>
        <p><strong>IMEI:</strong> ${imei}</p>
        <table>
          <tr><th>Model</th><td>${model}</td></tr>
          <tr><th>iCloud / FMI</th><td>${icloud}</td></tr>
          <tr><th>Carrier</th><td>${carrier}</td></tr>
          <tr><th>GSMA Blacklist</th><td>${blacklist}</td></tr>
          <tr><th>MDM</th><td>${mdm}</td></tr>
          <tr><th>Notes</th><td>${notes}</td></tr>
        </table>
        <div style="text-align:center; margin-top:30px;">
          <button onclick="window.print()" style="padding:10px 20px; background:#102b55; color:white; border:none; border-radius:6px; cursor:pointer;">Print / Save PDF</button>
        </div>
      </body>
      </html>`;

      const blob = new Blob([html], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = ref + ".html";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 30000);

      $('gy-status').innerText = "✅ Report generated & downloaded successfully!";
    }

    function sendWhatsApp() {
      if (!report) {
        alert("Please generate the report first.");
        return;
      }
      const phone = report.phone.replace(/\D/g, "");
      if (!phone) {
        alert("Please enter customer WhatsApp number.");
        return;
      }
      const msg = `Hello! Your iPhone check report is ready.\nRef: ${report.ref}\nIMEI: ${report.imei}\nThank you for using GSM Yasser Server.`;
      window.open("https://wa.me/" + phone + "?text=" + encodeURIComponent(msg), "_blank");
    }

    return { login, logout, generatePDF, sendWhatsApp };
  })();
</script>

</body>
                                            </html>
