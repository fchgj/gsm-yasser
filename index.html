<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSM Yasser - iPhone IMEI Check</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --subtext-color: #65676b;
            --input-bg: #ffffff;
            --input-border: #ccd0d5;
            --input-text: #1a1a1a;
            --btn-bg: #0084ff;
            --btn-hover: #006dd6;
            --whatsapp-bg: #25d366;
            --whatsapp-hover: #1ebe5d;
        }

        [data-theme="dark"] {
            --bg-color: #18191a;
            --card-bg: #242526;
            --text-color: #e4e6eb;
            --subtext-color: #b0b3b8;
            --input-bg: #3a3b3c;
            --input-border: #3e4042;
            --input-text: #e4e6eb;
            --btn-bg: #2d88ff;
            --btn-hover: #1a77ff;
            --whatsapp-bg: #2bca64;
            --whatsapp-hover: #22a753;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; transition: background 0.3s, color 0.3s; }
        body { background: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        
        .container { background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; position: relative; }
        
        /* شريط الأدوات العلوي (اللغة والوضع الداكن) */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .top-btn { background: transparent; border: 1px solid var(--input-border); color: var(--text-color); padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .top-btn:hover { background: var(--input-border); }

        .logo h2 { color: var(--text-color); font-size: 24px; margin-bottom: 6px; }
        .logo p { color: var(--subtext-color); font-size: 13px; margin-bottom: 20px; }

        .input-group { margin-bottom: 16px; text-align: inherit; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--text-color); font-size: 13px; }
        
        input { width: 100%; padding: 14px; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--input-text); border-radius: 10px; font-size: 16px; text-align: center; letter-spacing: 1px; }
        input:focus { border-color: var(--btn-bg); outline: none; box-shadow: 0 0 0 3px rgba(0,132,255,0.15); }

        /* قسم الخدمات المدفوعة / الأسعار */
        .pricing-section { background: rgba(0,132,255,0.05); border: 1px dashed var(--btn-bg); padding: 12px; border-radius: 10px; margin-bottom: 16px; text-align: inherit; }
        .pricing-title { font-size: 13px; font-weight: bold; color: var(--btn-bg); margin-bottom: 4px; }
        .pricing-desc { font-size: 12px; color: var(--subtext-color); }

        .btn-primary { width: 100%; padding: 14px; background: var(--btn-bg); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
        .btn-primary:hover { background: var(--btn-hover); }
        .btn-primary:disabled { background: #b0b3b8; cursor: not-allowed; }

        /* زر واتساب */
        .btn-whatsapp { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: var(--whatsapp-bg); color: white; text-decoration: none; border-radius: 10px; font-size: 15px; font-weight: bold; margin-bottom: 15px; transition: background 0.2s; }
        .btn-whatsapp:hover { background: var(--whatsapp-hover); }

        .result-box { margin-top: 15px; padding: 14px; border-radius: 10px; font-size: 13px; text-align: inherit; display: none; line-height: 1.6; }
        .success { background: #e7f3ff; color: #004085; border: 1px solid #b8daff; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .loading { background: #fff8e1; color: #f57f17; border: 1px solid #ffecb3; }

        .footer { margin-top: 15px; font-size: 11px; color: var(--subtext-color); }
    </style>
</head>
<body>

<div class="container">
    <!-- شريط الأدوات العلوي -->
    <div class="top-bar">
        <button class="top-btn" onclick="toggleLanguage()" id="langBtn">English</button>
        <button class="top-btn" onclick="toggleTheme()" id="themeBtn">🌙 وضع داكن</button>
    </div>

    <div class="logo">
        <h2 id="txtTitle">GSM Yasser</h2>
        <p id="txtSubtitle">الاستعلام الذكي عن هواتف iPhone برقم الـ IMEI</p>
    </div>

    <!-- قسم الخدمات المدفوعة / الأسعار -->
    <div class="pricing-section">
        <div class="pricing-title" id="txtPriceTitle">⚡ خدمات فك الشفرات والـ iCloud (مدفوعة)</div>
        <div class="pricing-desc" id="txtPriceDesc">لخدمات الفك الشاملة، تفليش الأجهزة، أو الشحن الفوري تواصل معنا مباشرة عبر الواتساب.</div>
    </div>

    <div class="input-group">
        <label id="txtLabel" for="imeiInput">أدخل رقم الـ IMEI (15 رقم):</label>
        <input type="text" id="imeiInput" placeholder="35XXXXXXXXXXXXXXXXX" maxlength="15" autocomplete="off">
    </div>

    <button id="searchBtn" class="btn-primary" onclick="checkImei()">فحص الجهاز الآن</button>

    <!-- زر واتساب للتواصل المباشر والخدمات المدفوعة -->
    <a href="https://wa.me/213657241710?text=سلام عليكم، أريد الاستفسار عن خدمات GSM Yasser ومدفوعاتها" target="_blank" class="btn-whatsapp">
        💬 <span id="txtWhatsapp">تواصل عبر واتساب للخدمات المدفوعة</span>
    </a>

    <div id="resultBox" class="result-box"></div>

    <div class="footer">
        GSM Yasser Server &copy; 2026
    </div>
</div>

<script>
    // 🔑 ضع مفتاح الـ API الشخصي هنا فور حصولك عليه
    const PERSONAL_API_KEY = ""; 

    let currentLang = 'ar';
    let currentTheme = 'light';

    // نصوص الترجمة
    const translations = {
        ar: {
            langBtn: "English",
            themeDark: "🌙 وضع داكن",
            themeLight: "☀️ وضع فاتح",
            title: "GSM Yasser",
            subtitle: "الاستعلام الذكي عن هواتف iPhone برقم الـ IMEI",
            priceTitle: "⚡ خدمات فك الشفرات والـ iCloud (مدفوعة)",
            priceDesc: "لخدمات الفك الشاملة، تفليش الأجهزة، أو الشحن الفوري تواصل معنا مباشرة عبر الواتساب.",
            label: "أدخل رقم الـ IMEI (15 رقم):",
            btnSearch: "فحص الجهاز الآن",
            whatsapp: "تواصل عبر واتساب للخدمات المدفوعة",
            errLength: "❌ يرجى إدخال رقم IMEI صحيح ومكون من 15 رقماً بالضبط.",
            loadingMsg: "⏳ جاري فحص الـ IMEI والتحقق من قاعدة البيانات...",
            successMsg: "✅ تم التحقق بنجاح (iPhone متوافق):",
            errBrand: "عذراً، هذا الجهاز يعود لشركة",
            errOther: "أداة GSM Yasser مخصصة حصرياً لهواتف iPhone فقط.",
            notFound: "⚠️ لم يتم العثور على بيانات مطابقة لهذا الـ IMEI. يرجى التأكد من صحة الرقم.",
            pendingKey: "🛠️ الأداة جاهزة في انتظار تفعيل الـ API:"
        },
        en: {
            langBtn: "عربي",
            themeDark: "🌙 Dark Mode",
            themeLight: "☀️ Light Mode",
            title: "GSM Yasser",
            subtitle: "Smart iPhone IMEI Lookup Tool",
            priceTitle: "⚡ Premium & Unlock Services (Paid)",
            priceDesc: "For full unlocking services, device flashing, or instant wallet top-up, contact us directly via WhatsApp.",
            label: "Enter 15-Digit IMEI:",
            btnSearch: "Check Device Now",
            whatsapp: "Contact via WhatsApp for Paid Services",
            errLength: "❌ Please enter a valid 15-digit IMEI number.",
            loadingMsg: "⏳ Checking IMEI and querying database...",
            successMsg: "✅ Verification Successful (Compatible iPhone):",
            errBrand: "Sorry, this device belongs to",
            errOther: "GSM Yasser is exclusively dedicated to iPhone devices.",
            notFound: "⚠️ No matching records found for this IMEI. Please verify the number.",
            pendingKey: "🛠️ Tool Ready - Awaiting API Integration:"
        }
    };

    function toggleLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const html = document.getElementById('htmlRoot');
        html.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
        html.setAttribute('lang', currentLang);
        updateTexts();
    }

    function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        updateTexts();
    }

    function updateTexts() {
        const t = translations[currentLang];
        document.getElementById('langBtn').innerText = t.langBtn;
        document.getElementById('themeBtn').innerText = currentTheme === 'light' ? t.themeDark : t.themeLight;
        document.getElementById('txtTitle').innerText = t.title;
        document.getElementById('txtSubtitle').innerText = t.subtitle;
        document.getElementById('txtPriceTitle').innerText = t.priceTitle;
        document.getElementById('txtPriceDesc').innerText = t.priceDesc;
        document.getElementById('txtLabel').innerText = t.label;
        document.getElementById('searchBtn').innerText = t.btnSearch;
        document.getElementById('txtWhatsapp').innerText = t.whatsapp;
    }

    async function checkImei() {
        const imeiInput = document.getElementById('imeiInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultBox = document.getElementById('resultBox');
        const imei = imeiInput.value.trim();
        const t = translations[currentLang];

        if (imei.length !== 15 || isNaN(imei)) {
            showResult(t.errLength, 'error');
            return;
        }

        searchBtn.disabled = true;
        showResult(t.loadingMsg, 'loading');

        let apiUrl = `https://alpha.imeicheck.com/api/modelBrandName?imei=${imei}&format=json`;
        if (PERSONAL_API_KEY) {
            apiUrl += `&key=${PERSONAL_API_KEY}`;
        }

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error('Network response was not ok');

            const data = await response.json();
            const brand = (data.brand || '').toLowerCase();
            const model = data.model || 'iPhone (Model unspecified)';

            if (brand.includes('apple') || model.toLowerCase().includes('iphone')) {
                showResult(`
                    <b>${t.successMsg}</b><br>
                    • <b>Brand / الماركة:</b> Apple<br>
                    • <b>Model / الموديل:</b> ${model}<br>
                    • <b>IMEI:</b> ${imei}
                `, 'success');
            } else if (data.brand) {
                showResult(`⚠️ ${t.errBrand} (${data.brand}). ${t.errOther}`, 'error');
            } else {
                showResult(t.notFound, 'error');
            }

        } catch (error) {
            showResult(`
                <b>${t.pendingKey}</b><br>
                • IMEI: <b>${imei}</b><br>
                <span style="font-size: 11px; opacity: 0.8;">(Awaiting personal API key integration)[span_0](start_span)[span_0](end_span).</span>
            `, 'loading');
        } finally {
            setTimeout(() => { searchBtn.disabled = false; }, 3000);
        }
    }

    function showResult(message, type) {
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        resultBox.className = `result-box ${type}`;
        resultBox.innerHTML = message;
    }
</script>

</body>
    </html>
