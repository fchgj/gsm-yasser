<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSM Yasser - iPhone IMEI Check</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --subtext-color: #65676b;
            --input-bg: #ffffff;
            --input-border: #ccd0d5;
            --input-text: #1a1a1a;
            --btn-bg: #0084ff;
            --btn-hover: #006dd6;
            --whatsapp-bg: #25d366;
            --whatsapp-hover: #1ebe5d;
        }

        [data-theme="dark"] {
            --bg-color: #18191a;
            --card-bg: #242526;
            --text-color: #e4e6eb;
            --subtext-color: #b0b3b8;
            --input-bg: #3a3b3c;
            --input-border: #3e4042;
            --input-text: #e4e6eb;
            --btn-bg: #2d88ff;
            --btn-hover: #1a77ff;
            --whatsapp-bg: #2bca64;
            --whatsapp-hover: #22a753;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; transition: background 0.3s, color 0.3s; }
        body { background: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        
        .container { background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; position: relative; }
        
        /* Top bar for Theme Switcher */
        .top-bar { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 15px; }
        .top-btn { background: transparent; border: 1px solid var(--input-border); color: var(--text-color); padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .top-btn:hover { background: var(--input-border); }

        .logo h2 { color: var(--text-color); font-size: 24px; margin-bottom: 6px; }
        .logo p { color: var(--subtext-color); font-size: 13px; margin-bottom: 20px; }

        /* Pricing & Paid Services Section */
        .pricing-section { background: rgba(0,132,255,0.05); border: 1px dashed var(--btn-bg); padding: 12px; border-radius: 10px; margin-bottom: 16px; text-align: left; }
        .pricing-title { font-size: 13px; font-weight: bold; color: var(--btn-bg); margin-bottom: 4px; }
        .pricing-desc { font-size: 12px; color: var(--subtext-color); line-height: 1.4; }

        .input-group { margin-bottom: 16px; text-align: left; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--text-color); font-size: 13px; }
        
        input { width: 100%; padding: 14px; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--input-text); border-radius: 10px; font-size: 16px; text-align: center; letter-spacing: 1px; }
        input:focus { border-color: var(--btn-bg); outline: none; box-shadow: 0 0 0 3px rgba(0,132,255,0.15); }

        .btn-primary { width: 100%; padding: 14px; background: var(--btn-bg); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-bottom: 12px; }
        .btn-primary:hover { background: var(--btn-hover); }
        .btn-primary:disabled { background: #b0b3b8; cursor: not-allowed; }

        /* WhatsApp Direct Button */
        .btn-whatsapp { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: var(--whatsapp-bg); color: white; text-decoration: none; border-radius: 10px; font-size: 15px; font-weight: bold; margin-bottom: 15px; transition: background 0.2s; }
        .btn-whatsapp:hover { background: var(--whatsapp-hover); }

        .result-box { margin-top: 15px; padding: 14px; border-radius: 10px; font-size: 13px; text-align: left; display: none; line-height: 1.6; }
        .success { background: #e7f3ff; color: #004085; border: 1px solid #b8daff; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .loading { background: #fff8e1; color: #f57f17; border: 1px solid #ffecb3; }

        .footer { margin-top: 15px; font-size: 11px; color: var(--subtext-color); }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Bar: Dark/Light Theme Switcher -->
    <div class="top-bar">
        <button class="top-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    </div>

    <div class="logo">
        <h2>GSM Yasser</h2>
        <p>Smart iPhone IMEI Lookup & Services Tool</p>
    </div>

    <!-- Paid Services & Pricing Notice -->
    <div class="pricing-section">
        <div class="pricing-title">⚡ Premium & Paid Services</div>
        <div class="pricing-desc">For Network Unlocks, iCloud Bypass, Device Flashing, or Instant Wallet Top-ups, contact us directly via WhatsApp.</div>
    </div>

    <div class="input-group">
        <label for="imeiInput">Enter 15-Digit IMEI:</label>
        <input type="text" id="imeiInput" placeholder="35XXXXXXXXXXXXXXXXX" maxlength="15" autocomplete="off">
    </div>

    <button id="searchBtn" class="btn-primary" onclick="checkImei()">Check Device Now</button>

    <!-- Direct WhatsApp Button with Number 0657241710 -->
    <a href="https://wa.me/213657241710?text=Hello%20Yasser,%20I%20would%20like%20to%20inquire%20about%20GSM%20Yasser%20paid%20services." target="_blank" class="btn-whatsapp">
        💬 Contact via WhatsApp (Paid Services)
    </a>

    <div id="resultBox" class="result-box"></div>

    <div class="footer">
        GSM Yasser Server &copy; 2026
    </div>
</div>

<script>
    // 🔑 Insert your personal API key here once received to activate direct connection
    const PERSONAL_API_KEY = ""; 

    let currentTheme = 'light';

    function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.getElementById('themeBtn').innerText = currentTheme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    async function checkImei() {
        const imeiInput = document.getElementById('imeiInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultBox = document.getElementById('resultBox');
        const imei = imeiInput.value.trim();

        // 1. Validate 15 digits requirement
        if (imei.length !== 15 || isNaN(imei)) {
            showResult('❌ Please enter a valid 15-digit IMEI number.', 'error');
            return;
        }

        // 2. Temporarily disable search button to prevent spamming
        searchBtn.disabled = true;
        showResult('⏳ Checking IMEI and querying database...', 'loading');

        // Build the API URL with or without the API key
        let apiUrl = `https://alpha.imeicheck.com/api/modelBrandName?imei=${imei}&format=json`;
        if (PERSONAL_API_KEY) {
            apiUrl += `&key=${PERSONAL_API_KEY}`;
        }

        try {
            const response = await fetch(apiUrl);
            
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }

            const data = await response.json();

            // 3. Extract data
            const brand = (data.brand || '').toLowerCase();
            const model = data.model || 'iPhone (Model unspecified)';

            // 4. Strict Apple/iPhone filtering
            if (brand.includes('apple') || model.toLowerCase().includes('iphone')) {
                showResult(`
                    <b>✅ Verification Successful (Compatible iPhone):</b><br>
                    • <b>Brand:</b> Apple<br>
                    • <b>Model:</b> ${model}<br>
                    • <b>IMEI:</b> ${imei}
                `, 'success');
            } else if (data.brand) {
                showResult(`⚠️ Sorry, this device belongs to (${data.brand}). GSM Yasser is exclusively dedicated to <b>iPhone</b> devices.`, 'error');
            } else {
                showResult('⚠️ No matching records found for this IMEI. Please verify the number.', 'error');
            }

        } catch (error) {
            showResult(`
                <b>🛠️ Tool Ready - Awaiting API Integration:</b><br>
                • Entered IMEI: <b>${imei}</b><br>
                <span style="font-size: 11px; opacity: 0.8;">(Waiting to insert your free personal API key to fetch live results directly)[span_0](start_span)[span_0](end_span).</span>
            `, 'loading');
            console.error('API Error / Pending Key:', error);
        } finally {
            // Re-enable button after 3 seconds
            setTimeout(() => {
                searchBtn.disabled = false;
            }, 3000);
        }
    }

    function showResult(message, type) {
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        resultBox.className = `result-box ${type}`;
        resultBox.innerHTML = message;
    }
</script>

</body>
        </html>
