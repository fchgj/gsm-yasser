<!-- ================================================= -->
<!-- GSM YASSER SERVER - INTEGRATED ADMIN PANEL & UI -->
<!-- ================================================= -->

<style>
/* تنسيقات لوحة الإدارة السرية لتتطابق مع تصميم موقعك الداكن */
#gy-admin-container {
  max-width: 650px;
  margin: 30px auto;
  background: #121e2b;
  color: #fff;
  padding: 25px;
  border-radius: 16px;
  border: 1px solid #2a3b52;
  font-family: Arial, sans-serif;
  box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}
#gy-admin-container h3 {
  color: #f59e0b;
  text-align: center;
  margin-bottom: 5px;
  font-size: 20px;
}
#gy-admin-container label {
  display: block;
  font-weight: bold;
  margin-top: 12px;
  font-size: 13px;
  color: #cbd5e1;
}
#gy-admin-container input, 
#gy-admin-container select, 
#gy-admin-container textarea {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  background: #1a293d;
  border: 1px solid #334e68;
  border-radius: 8px;
  color: #fff;
  box-sizing: border-box;
  font-size: 14px;
}
#gy-admin-container input:focus, 
#gy-admin-container select:focus, 
#gy-admin-container textarea:focus {
  border-color: #f59e0b;
  outline: none;
}
#gy-admin-container button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
  transition: opacity 0.2s;
}
#gy-admin-container button:hover { opacity: 0.9; }
.btn-primary-gy { background: #f59e0b; color: #121e2b; }
.btn-whatsapp-gy { background: #25d366; color: #fff; }
.btn-danger-gy { background: #ef4444; color: #fff; }
.btn-login-gy { background: #334e68; color: #fff; width: auto; padding: 10px 20px; margin: 20px auto; display: block; border-radius: 8px; font-weight: bold; border: 0; cursor: pointer; }
</style>

<!-- زر الدخول السري للوحة الإدارة (يمكن وضعه أسفل الصفحة) -->
<div style="text-align:center; margin: 40px 0;">
  <button type="button" class="btn-login-gy" onclick="GYAdminPanel.login()">
    🔐 Admin Login (لوحة المشرف)
  </button>
</div>

<!-- لوحة الإدارة السرية (مخفية افتراضياً) -->
<div id="gy-admin-section" style="display: none;">
  <div id="gy-admin-container">
    <h3>GSM Yasser – Paid Report Admin Panel</h3>
    <p style="text-align:center; color:#94a3b8; font-size:12px; margin-bottom:15px;">إدخال نتائج الفحص المدفوع يدوياً وإصدار التقارير</p>

    <label>Customer WhatsApp Number (رقم واتساب العميل)</label>
    <input id="gy-phone" type="tel" placeholder="مثال: 213657241710">

    <label>IMEI (15 Digits)</label>
    <input id="gy-imei" maxlength="15" inputmode="numeric" placeholder="أدخل 15 رقماً للـ IMEI">

    <label>Device Model (موديل الجهاز)</label>
    <input id="gy-model" placeholder="مثال: iPhone 13 Pro Max">

    <label>iCloud / FMI Status (حالة الأيكلاود)</label>
    <select id="gy-icloud">
      <option value="Not Checked">Not Checked</option>
      <option value="OFF">OFF (Clean / نظيف)</option>
      <option value="ON">ON (Lost / مقفل)</option>
    </select>

    <label>Carrier / Network (الشبكة)</label>
    <select id="gy-carrier">
      <option value="Not Checked">Not Checked</option>
      <option value="Factory Unlocked">Factory Unlocked (مفتوح رسمي)</option>
      <option value="Locked">Locked (مقفل)</option>
    </select>

    <label>GSMA Blacklist (القائمة السوداء)</label>
    <select id="gy-blacklist">
      <option value="Not Checked">Not Checked</option>
      <option value="Clean">Clean (نظيف)</option>
      <option value="Blacklisted">Blacklisted (مبلغ عنه)</option>
    </select>

    <label>MDM Status (إدارة الأجهزة)</label>
    <select id="gy-mdm">
      <option value="Not Checked">Not Checked</option>
      <option value="ON">ON (Enrolled / مقيّد)</option>
      <option value="OFF">OFF (Clean / خالي)</option>
    </select>

    <label>Report Language (لغة التقرير)</label>
    <select id="gy-language">
      <option value="ar">العربية (Arabic)</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
    </select>

    <label>Additional Notes (ملاحظات إضافية)</label>
    <textarea id="gy-notes" rows="3" placeholder="ملاحظات للعميل أو تفاصيل الخدمة..."></textarea>

    <button type="button" class="btn-primary-gy" onclick="GYAdminPanel.generatePDF()">
      🖨️ Generate & Download PDF Report (إصدار التقرير)
    </button>

    <button type="button" class="btn-whatsapp-gy" onclick="GYAdminPanel.sendWhatsApp()">
      💬 Send via WhatsApp (فتح واتساب)
    </button>

    <button type="button" class="btn-danger-gy" onclick="GYAdminPanel.logout()">
      🔒 Logout (إغلاق اللوحة)
    </button>

    <div id="gy-status" style="margin-top:12px; font-size:13px; color:#10b981; font-weight:bold; text-align:center;"></div>
  </div>
</div>

<!-- السكريبت البرمجي للتحكم باللوحة وتوليد التقارير باللغات الثلاث -->
<script>
const GYAdminPanel = (() => {
  const SECRET_PASSWORD = "wP5t5B3d.";
  let currentReport = null;
  const $ = id => document.getElementById(id);

  function login() {
    const password = prompt("🔐 أدخل كلمة مرور لوحة الإدارة:");
    if (password === null) return;

    if (password !== SECRET_PASSWORD) {
      alert("❌ كلمة المرور غير صحيحة!");
      return;
    }

    $("gy-admin-section").style.display = "block";
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function logout() {
    $("gy-admin-section").style.display = "none";
    currentReport = null;
  }

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, char => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    })[char]);
  }

  function generatePDF() {
    const imei = $("gy-imei").value.trim();
    if (!/^\d{15}$/.test(imei)) {
      alert("⚠️ الخطأ: يجب أن يتكون رقم الـ IMEI من 15 رقماً بدقة.");
      return;
    }

    const lang = $("gy-language").value;
    const translations = {
      en: { title: "iPhone Check Report", model: "Device Model", icloud: "iCloud / FMI", carrier: "Carrier / Network", blacklist: "GSMA Blacklist", mdm: "MDM", date: "Check Date", notes: "Notes" },
      ar: { title: "تقرير فحص آيفون رسمي", model: "موديل الجهاز", icloud: "آيكلاود / FMI", carrier: "الشبكة / شركة الاتصالات", blacklist: "القائمة السوداء GSMA", mdm: "إدارة الأجهزة MDM", date: "تاريخ الفحص", notes: "ملاحظات إضافية" },
      fr: { title: "Rapport de vérification iPhone", model: "Modèle", icloud: "iCloud / FMI", carrier: "Réseau / Opérateur", blacklist: "Liste noire GSMA", mdm: "MDM", date: "Date de vérification", notes: "Remarques" }
    };

    const t = translations[lang];
    const data = {
      imei,
      model: $("gy-model").value || "Not Checked",
      icloud: $("gy-icloud").value,
      carrier: $("gy-carrier").value,
      blacklist: $("gy-blacklist").value,
      mdm: $("gy-mdm").value,
      date: new Date().toLocaleString(),
      notes: $("gy-notes").value || "-"
    };

    const ref = "GYS-" + Date.now();
    currentReport = { ...data, ref, phone: $("gy-phone").value.trim(), lang };

    const rows = [
      [t.model, data.model],
      [t.icloud, data.icloud],
      [t.carrier, data.carrier],
      [t.blacklist, data.blacklist],
      [t.mdm, data.mdm],
      [t.date, data.date],
      [t.notes, data.notes]
    ].map(([lbl, val]) => `<tr><th>${escapeHTML(lbl)}</th><td>${escapeHTML(val)}</td></tr>`).join("");

    const rtl = lang === "ar";
    const html = `<!DOCTYPE html>
    <html lang="${lang}" dir="${rtl ? "rtl":"ltr"}">
    <head>
      <meta charset="UTF-8">
      <title>${escapeHTML(t.title)}</title>
      <style>
        body { font-family: Arial, sans-serif; padding: 40px; color: #172033; background: #fff; }
        h1 { color: #102b55; text-align: center; margin-bottom: 5px; }
        .sub { text-align: center; color: #555; font-size: 14px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccd3df; padding: 12px; text-align: start; font-size: 15px; }
        th { background: #eef2f7; width: 38%; color: #102b55; }
        .imei-box { font-weight: bold; text-align: center; margin-top: 20px; font-size: 16px; background: #f8fafc; padding: 10px; border-radius: 6px; }
        @media print { button { display: none; } }
      </style>
    </head>
    <body>
      <h1>GSM YASSER Server</h1>
      <p class="sub">Official Device Verification Report</p>
      <h2>${escapeHTML(t.title)}</h2>
      <p style="text-align:center; color:#64748b; font-weight:bold;">Reference: ${escapeHTML(ref)}</p>
      <div class="imei-box">IMEI: ${escapeHTML(imei)}</div>
      <table>${rows}</table>
      <p style="text-align:center; margin-top:35px; font-weight:bold; color:#102b55; font-size:13px;">
        Verified by GSM Yasser Server – All rights reserved © 2026
      </p>
      <div style="text-align:center; margin-top:25px;">
        <button onclick="window.print()" style="background:#102b55; color:white; padding:12px 30px; border:0; border-radius:6px; cursor:pointer; font-size:16px; font-weight:bold;">🖨️ Print / Save as PDF</button>
      </div>
    </body>
    </html>`;

    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = ref + ".html";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 30000);

    $("gy-status").innerText = "✅ Done! Report generated & downloaded successfully.";
  }

  function sendWhatsApp() {
    if (!currentReport) {
      alert("⚠️ Please generate the report first.");
      return;
    }
    const phone = currentReport.phone.replace(/\D/g, "");
    if (!phone) {
      alert("⚠️ Please enter customer WhatsApp number.");
      return;
    }
    const msg = `Hello! Your iPhone check report is ready.\nRef: ${currentReport.ref}\nIMEI: ${currentReport.imei}\nThank you for using GSM Yasser Server.`;
    window.open("https://wa.me/" + phone + "?text=" + encodeURIComponent(msg), "_blank");
  }

  return { login, logout, generatePDF, sendWhatsApp };
})();
</script>
