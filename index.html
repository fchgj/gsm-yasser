
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فحص IMEI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;text-align:center;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:16px;max-width:420px;margin:auto}
input{width:100%;padding:14px;border-radius:10px;border:none;margin:10px 0;font-size:18px;text-align:center;box-sizing:border-box}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#22c55e;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}
.result{margin-top:15px;background:#0f172a;padding:15px;border-radius:10px;line-height:1.8}
</style>
</head>
<body>
<div class="card">
<h2>🔍 فحص IMEI</h2>
<input id="imei" placeholder="اكتب IMEI هنا" maxlength="15">
<button onclick="check()">افحص الآن</button>
<div id="out" class="result">اكتب IMEI و اضغط فحص</div>
</div>

<script>
const supabaseClient = supabase.createClient(
  "https://ojwxreptapmezxxgoanb.supabase.co",
  "sb_publishable_k6sc-edt-T4zOsDdWNQyQw_H6QHn4Pz"
);

async function check(){
  let imei = document.getElementById('imei').value.trim();
  if(imei.length < 14){ alert('اكتب IMEI صحيح'); return; }
  document.getElementById('out').innerHTML = '⏳ جاري الفحص...';
  let model = "iPhone 13 Pro";
  let result = "Clean ✅ - غير مسروق";
  const { error } = await supabaseClient.from('checks').insert([{ imei: imei, model: model, result: result }]);
  if(error){
    document.getElementById('out').innerHTML = '❌ خطأ: ' + error.message;
  } else {
    document.getElementById('out').innerHTML = '✅ تم الحفظ في Supabase<br><b>IMEI:</b> '+imei+'<br><b>الموديل:</b> '+model+'<br><b>النتيجة:</b> '+result;
  }
}
</script>
</body>
</html>
