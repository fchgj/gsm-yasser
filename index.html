<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GSM Yasser Server — iPhone IMEI Checker</title>
  <style>
    :root {
      --bg: #070d19;
      --surface: #0f172a;
      --card: #131f35;
      --card-hover: #182742;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: rgba(148, 163, 184, 0.16);
      --badge-bg: rgba(245, 158, 11, 0.16);
      --badge-text: #fbbf24;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    body.light {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --card: #ffffff;
      --card-hover: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --border: rgba(15, 23, 42, 0.12);
      --badge-bg: rgba(217, 119, 6, 0.12);
      --badge-text: #b45309;
      --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, rgba(37, 99, 235, 0.12), transparent 45%), var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.65;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px;
    }

    /* شريط علوي عالمي متجاوب */
    .topbar {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 16px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .topbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-pill {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 14px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .btn-pill:hover {
      background: var(--card-hover);
      border-color: var(--primary);
    }

    .btn-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* ترويسة الموقع */
    .hero {
      text-align: center;
      max-width: 760px;
      margin: 0 auto 32px;
    }

    .hero h1 {
      font-size: clamp(1.55rem, 3vw, 2.3rem);
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .hero p {
      color: var(--muted);
      font-size: clamp(0.95rem, 1.5vw, 1.08rem);
    }

    /* شبكة سطح المكتب الرئيسية */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (min-width: 900px) {
      .main-grid {
        grid-template-columns: 420px 1fr;
        gap: 28px;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 20px;
      padding: 24px;
    }

    .panel h2 {
      font-size: 1.22rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .panel .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 13px 15px;
      font-size: 0.96rem;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .captcha-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .captcha-row .input {
      margin-bottom: 0;
      flex: 1;
    }

    .captcha-box {
      background: #0b1324;
      color: #e2e8f0;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 3px;
      user-select: none;
      white-space: nowrap;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    .help-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 0.86rem;
      color: #3b82f6;
      text-decoration: none;
    }

    .help-link:hover {
      text-decoration: underline;
    }

    .result-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 0.9rem;
      display: none;
    }

    .result-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:hover {
      border-color: var(--primary);
    }

    /* شبكة الخدمات المدفوعة على الشاشات الكبيرة */
    .services-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 640px) {
      .services-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .service-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .service-card:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: rgba(37, 99, 235, 0.45);
    }

    .service-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .service-title {
      font-weight: 700;
      font-size: 1rem;
    }

    .badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .service-desc {
      color: var(--muted);
      font-size: 0.86rem;
      margin-bottom: 16px;
    }

    .btn-wa {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.18s ease;
    }

    .btn-wa:hover {
      background: #16a34a;
      color: #ffffff;
      border-color: #16a34a;
    }

    /* التذييل */
    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.84rem;
      margin-top: 36px;
      padding-bottom: 24px;
    }

    .footer-pill {
      display: inline-block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 16px;
      color: var(--text);
      margin-bottom: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
      direction: ltr;
    }

    /* تنسيق الطباعة على ويندوز */
    @media print {
      .topbar, .services-panel, .captcha-row, .btn-primary, .help-link, .result-actions, .footer-pill {
        display: none !important;
      }
      body {
        background: #ffffff;
        color: #000000;
      }
      .panel {
        box-shadow: none;
        border: 1px solid #cbd5e1;
      }
      .result-box {
        display: block !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- الشريط العلوي -->
    <div class="topbar">
      <div class="brand-mini">
        <span class="brand-dot"></span>
        <span>GSM Yasser Server</span>
      </div>

      <div class="topbar-controls">
        <div class="topbar-group">
          <button class="btn-pill" id="themeBtn" type="button" onclick="toggleTheme()">🌙 داكن</button>
        </div>
        <div class="topbar-group">
          <button class="btn-pill" id="langEn" type="button" onclick="setLang('en')">EN</button>
          <button class="btn-pill" id="langFr" type="button" onclick="setLang('fr')">FR</button>
          <button class="btn-pill active" id="langAr" type="button" onclick="setLang('ar')">العربية</button>
        </div>
      </div>
    </div>

    <!-- العنوان الرئيسي -->
    <header class="hero">
      <h1 id="heroTitle">GSM Yasser Server — فحص IMEI لـ iPhone</h1>
      <p id="heroSubtitle">فحص رقم IMEI لهواتف iPhone وخدمات الفحص المدفوعة</p>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-grid">
      <!-- قسم الفحص المجاني -->
      <section class="panel">
        <h2 id="freeTitle">فحص مجاني</h2>
        <p class="sub" id="freeSub">تحقق من رقم IMEI المكوّن من 15 رقماً واطبع أو احفظ التقرير</p>

        <input
          type="text"
          id="imeiInput"
          class="input"
          maxlength="15"
          placeholder="أدخل رقم IMEI المكوّن من 15 رقماً"
          oninput="this.value = this.value.replace(/\D/g, '')"
        />

        <div class="captcha-row">
          <input type="text" id="captchaInput" class="input" placeholder="الرمز" />
          <div class="captcha-box" id="captchaDisplay">NMKLU
