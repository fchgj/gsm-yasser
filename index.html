<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1420">
<title>GSM YASSER SERVER</title>

<style>
:root{
  --bg:#0b1420;
  --card:#142235;
  --input:#0c1827;
  --border:#293d54;
  --text:#f5f8fc;
  --muted:#a4b2c2;
  --blue:#1479ef;
  --green:#16a875;
  --red:#e34d4d;
  --primary:#f59e0b;
}
[data-theme="light"]{
  --bg:#f1f5f9;
  --card:#ffffff;
  --input:#f8fafc;
  --border:#cbd5e1;
  --text:#0f172a;
  --muted:#64748b;
  --blue:#f59e0b;
  --green:#10b981;
  --red:#ef4444;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  transition: background 0.3s, color 0.3s;
}
header{
  background:#101d2c;
  padding:25px 15px;
  text-align:center;
  border-bottom:1px solid var(--border);
}
[data-theme="light"] header{background:#e2e8f0}
.logo{font-size:26px;font-weight:900;letter-spacing:1px}
.logo span{color:#2993ff}
header p{color:var(--muted);font-size:13px}
.container{max-width:1000px;margin:25px auto;padding:0 15px}
.top-controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  flex-wrap:wrap;
  gap:10px;
}
.ctrl-group{display:flex;gap:5px;flex-wrap:wrap}
.ctrl-btn{
  background:#1a293d;
  color:var(--muted);
  border:1px solid var(--border);
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:11px;
  font-weight:bold;
}
[data-theme="light"] .ctrl-btn{background:#e2e8f0;color:#334155}
.ctrl-btn.active{
  background:var(--primary);
  color:#0b1420;
  border-color:var(--primary);
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  padding:20px;
  margin-bottom:18px;
}
h2{font-size:19px;margin:0 0 15px}
h3{font-size:16px}
label{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin:12px 0 7px;
}
input,select,textarea{
  width:100%;
  padding:13px;
  background:var(--input);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-size:14px;
  outline:none;
}
textarea{min-height:80px}
button{
  background:var(--blue);
  color:white;
  border:0;
  border-radius:8px;
  padding:12px 16px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:.88}
button.full{width:100%;margin-top:14px}
button.green{background:var(--green)}
button.gray{background:#40536a}
button.red{background:var(--red)}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:13px;
}
.service{
  background:#192b40;
  padding:16px;
  border:1px solid var(--border);
  border-radius:10px;
}
[data-theme="light"] .service{background:#f8fafc}
.service p{color:var(--muted);font-size:13px;line-height:1.5}
.price{color:#62b1ff;font-weight:bold}
.result{
  display:none;
  background:#0c1c2c;
  border:1px solid var(--border);
  padding:14px;
  border-radius:8px;
  margin-top:14px;
  line-height:1.7;
}
[data-theme="light"] .result{background:#f1f5f9}
.good{color:#32d69b}
.bad{color:#ff7777}
.small{font-size:12px;color:var(--muted)}
.admin{display:none}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:580px;font-size:13px}
th,td{padding:11px;border-bottom:1px solid var(--border);text-align:left}
th{color:#73baff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
footer{text-align:center;padding:25px;color:var(--muted);font-size:12px}
@media(max-width:600px){
 .logo{font-size:21px}
 .card{padding:15px}
}
</style>
</head>

<body>

<header>
  <div class="logo">GSM YASSER <span>SERVER</span></div>
  <p id="headerSub">Professional iPhone Check & Mobile Services</p>
</
