<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSM YASSER SERVER</title>
  <style>
    :root {
      --bg: #0b131e;
      --card-bg: #121e2b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --border-card: #223349;
      --primary: #f59e0b;
      --accent: #10b981;
    }
    [data-theme="light"] {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-card: #cbd5e1;
      --primary: #f59e0b;
      --accent: #10b981;
    }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      transition: background 0.3s, color 0.3s;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid var(--border-card);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .lang-group, .currency-group {
      display: flex;
      gap: 5px;
    }
    .top-btn {
      background: #1a293d;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }
    [data-theme="light"] .top-btn {
      background: #e2e8f0;
      color: #334155;
      border-color: #cbd5e1;
    }
    .top-btn.active {
      background: var(--primary);
      color: #0b131e;
      border-color: var(--primary);
    }
    h1 {
      text-align: center;
      color: var(--primary);
      font-size: 20px;
      margin: 10px 0 15px;
      letter-spacing: 1px;
    }
    .imei-box {
      background: #0f172a;
      border: 1px solid #223349;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
    }
    [data-theme="light"] .imei-box { background: #f8fafc; }
    .imei-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .connected-badge { color: var(--accent); font-weight: bold; }
    .imei-input-field {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      outline: none;
      padding: 5px 0;
      box-sizing: border-box;
    }
    .free-box {
      background: #0f172a;
      border: 1px solid #223349;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      position: relative;
    }
    [data-theme="light"] .free-box { background: #f8fafc; }
    .free-tag {
      position: absolute;
      top: 15px;
      right: 15px;
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .free-title { font-size: 14px; font-weight: bold; margin: 0 0 4px; }
    .free-desc { font-size: 11px; color: var(--text-muted); margin: 0 0 12px; }
    .btn-green {
      background: var(--accent);
      color: #fff;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .section-title {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: bold;
    }
    .service-card {
      background: #0f172a;
      border: 1px solid #223349;
      padding: 12px 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    [data-theme="light"] .service-card { background: #f8fafc; }
    .service-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .service-name { font-size: 13px; font-weight: bold; margin: 0; }
    .service-sub { font-size: 11px; color: var(--text-muted); margin: 3px 0 0; }
    .price-badge {
      background: var(--primary);
      color: #0b131e;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: bold;
    }
    .btn-orange {
      background: var(--primary);
      color: #0b131e;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    #gy-admin-section {
      display: none;
      margin-top: 25px;
      border-top: 2px dashed var(--primary);
      padding-top: 20px;
    }
    .admin-input, .admin-select, .admin-textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      margin-top: 5px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    .admin-label { font-size: 12px; font-weight: bold; color: var(--text-muted); display: block; }
    .db-record {
      background: #1a293d;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 11px;
    }
  </style>
</head>
