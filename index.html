<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GSM Yasser Server — منصة استعلام مستقلة لـ iPhone IMEI</title>
  <style>
    :root {
      --bg: #070d1a;
      --surface: #0f172a;
      --surface-2: #162033;
      --surface-3: #1e293b;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.16);
      --gold: #eab308;
      --gold-soft: rgba(234, 179, 8, 0.16);
      --border: #24324a;
      --badge-bg: rgba(245, 158, 11, 0.16);
      --badge-text: #fbbf24;
      --ok: #22c55e;
      --err: #ef4444;
      --warn: #f59e0b;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.36);
      --mono: "SF Mono", "Consolas", "Menlo", monospace;
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #e2e8f0;
      --text: #0f172a;
      --muted: #334155;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.1);
      --gold: #b45309;
      --gold-soft: #fef3c7;
      --border: #cbd5e1;
      --badge-bg: #fef3c7;
      --badge-text: #b45309;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
      font-size: 17px;
      overflow-x: clip;
      max-width: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.72;
      min-height: 100vh;
      overflow-x: clip;
      max-width: 100%;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .ltr-num {
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block;
      font-family: var(--mono);
    }

    .wrap {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 14px 48px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ---------- 0. TOP INDEPENDENT LOGO + NAME ---------- */
    .top-logo-banner {
      order: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
      border: 1.5px solid rgba(234, 179, 8, 0.42);
      border-radius: 18px;
      padding: 14px 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--text);
      transition: transform 0.2s ease, border-color 0.2s ease;
      max-width: 100%;
    }

    .top-logo-banner:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .top-logo-emblem {
      width: 58px;
      height: 58px;
      border-radius: 15px;
      background: radial-gradient(circle at 30% 25%, #1e293b 0%, #090f1d 100%);
      border: 1.5px solid rgba(234, 179, 8, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(234, 179, 8, 0.18);
      overflow: hidden;
    }

    .top-logo-emblem svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .top-logo-text-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
    }

    .top-logo-title {
      font-size: 1.38rem;
      font-weight: 900;
      letter-spacing: 0.4px;
      line-height: 1.25;
      background: linear-gradient(90deg, var(--text) 20%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    [data-theme="light"] .top-logo-title {
      background: none;
      -webkit-text-fill-color: var(--text);
    }

    .top-logo-badge {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.5px;
    }

    /* ---------- 1. TOPBAR ---------- */
    .topbar {
      order: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      max-width: 100%;
      min-width: 0;
    }

    .top-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .chip-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 11px;
      min-height: 44px;
      padding: 9px 14px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.08s ease;
    }

    .chip-btn:hover { border-color: var(--accent); }
    .chip-btn:active { transform: scale(0.98); }
    .chip-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* ---------- DRAWER MENU ---------- */
    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      z-index: 960;
    }

    .drawer-backdrop.open { display: block; }

    .drawer-panel {
      position: fixed;
      top: 0;
      inset-inline-start: 0;
      width: min(340px, 88vw);
      height: 100vh;
      background: var(--surface);
      border-inline-end: 1px solid var(--border);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      box-shadow: var(--shadow);
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 14px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .drawer-brand {
      font-size: 1.08rem;
      font-weight: 800;
    }

    .drawer-item {
      width: 100%;
      text-align: start;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 50px;
      padding: 12px 15px;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .drawer-item:hover {
      border-color: var(--accent);
      background: rgba(37, 99, 235, 0.1);
    }

    /* ---------- 2. HERO ---------- */
    .hero {
      order: 2;
      text-align: center;
      max-width: 860px;
      margin: 0 auto 26px;
      padding: 0 6px;
      min-width: 0;
    }

    .hero h1 {
      font-size: 1.85rem;
      font-weight: 900;
      margin-bottom: 10px;
      letter-spacing: -0.2px;
      line-height: 1.38;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.06rem;
    }

    /* ---------- 3 & 4. MAIN LAYOUT ---------- */
    .main-layout {
      order: 3;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 22px;
      align-items: start;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .left-column {
      order: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      min-width: 0;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    #imeiCheckSection {
      border-color: rgba(37, 99, 235, 0.42);
      justify-content: flex-start;
    }

    #paidServicesSection {
      order: 2;
    }

    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 800;
    }

    .free-pill {
      background: rgba(34, 197, 94, 0.16);
      color: var(--ok);
      font-size: 0.85rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .card-sub {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 18px;
    }

    /* ---------- FORM ---------- */
    #imeiForm {
      display: flex;
      flex-direction: column;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
    }

    .field {
      width: 100%;
      max-width: 100%;
      min-height: 56px;
      background: var(--surface-2);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 13px;
      padding: 14px 16px;
      font-size: 1.12rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.22);
    }

    #imeiInput {
      font-family: var(--mono);
      letter-spacing: 1.8px;
      font-size: 1.2rem;
      font-weight: 800;
      direction: ltr;
      text-align: left;
    }

    #imeiInput::placeholder {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      letter-spacing: 0;
      font-size: 1rem;
      font-weight: 500;
      text-align: start;
    }

    #imeiInput.valid   { border-color: var(--ok); }
    #imeiInput.invalid { border-color: var(--err); }

    .imei-hint {
      font-size: 0.92rem;
      font-weight: 700;
      margin-top: 8px;
      min-height: 1.3em;
      color: var(--muted);
      transition: color 0.2s ease;
    }

    .imei-hint.ok  { color: var(--ok); }
    .imei-hint.err { color: var(--err); }

    .captcha-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
      max-width: 100%;
      min-width: 0;
    }

    .captcha-label {
      font-size: 1rem;
      font-weight: 700;
    }

    .captcha-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 220px;
      max-width: 100%;
      min-width: 0;
      flex-wrap: wrap;
    }

    .captcha-input {
      flex: 1 1 95px;
      min-width: 0;
      min-height: 50px;
      text-align: center;
      background: var(--surface-2);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 13px;
      padding: 10px 12px;
      font-family: var(--mono);
      letter-spacing: 2px;
      font-size: 1.08rem;
      font-weight: 800;
      outline: none;
      text-transform: uppercase;
    }

    .captcha-input:focus { border-color: var(--accent); }

    .captcha-box {
      background: var(--surface-2);
      color: var(--text);
      border: 1.5px dashed var(--border);
      border-radius: 13px;
      min-height: 50px;
      padding: 10px 14px;
      font-weight: 800;
      letter-spacing: 2.5px;
      font-size: 1.1rem;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      flex-shrink: 0;
    }

    .refresh-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 13px;
      width: 50px;
      height: 50px;
      font-size: 1.3rem;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.08s ease;
    }

    .refresh-btn:hover {
      border-color: var(--accent);
      background: rgba(37, 99, 235, 0.12);
    }
    .refresh-btn:active { transform: scale(0.96); }

    .primary-btn {
      width: 100%;
      max-width: 100%;
      min-height: 54px;
      margin-top: 18px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 13px;
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.32);
      transition: background 0.2s ease, transform 0.08s ease;
    }

    .primary-btn:hover { background: var(--accent-hover); }
    .primary-btn:active { transform: scale(0.99); }
    .primary-btn:disabled { opacity: 0.65; cursor: not-allowed; }

    .primary-btn .progress {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.18);
      transform-origin: left;
      transform: scaleX(0);
      transition: transform 0.3s ease;
      pointer-events: none;
    }

    [dir="rtl"] .primary-btn .progress { transform-origin: right; }
    .primary-btn.loading .progress { transform: scaleX(1); }

    /* ---------- IPHONE PROMO BANNER ---------- */
    .iphone-promo-banner {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--surface-2) 0%, rgba(37, 99, 235, 0.14) 100%);
      border: 1px solid rgba(234, 179, 8, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .iphone-promo-banner:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .iphone-promo-copy {
      flex: 1;
      min-width: 0;
    }

    .iphone-promo-copy strong {
      display: block;
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--text);
    }

    .iphone-promo-copy span {
      display: block;
      font-size: 0.88rem;
      color: var(--muted);
    }

    /* ---------- TIPS BOX ---------- */
    .tips-box {
      margin-top: 14px;
      background: var(--surface-2);
      border: 1px dashed var(--border);
      border-radius: 13px;
      padding: 14px 16px;
      font-size: 0.96rem;
      color: var(--muted);
      max-width: 100%;
      min-width: 0;
    }

    .tips-box strong { color: var(--text); font-weight: 800; }
    .tips-box ul { margin: 8px 0 0; padding-inline-start: 20px; }
    .tips-box li { margin-bottom: 5px; }

    .help-line {
      text-align: center;
      margin-top: 14px;
      font-size: 0.98rem;
      color: var(--muted);
      max-width: 100%;
    }

    .help-line a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 700;
    }

    [data-theme="light"] .help-line a {
      color: var(--accent);
    }

    .help-line a:hover { text-decoration: underline; }

    /* ---------- IPHONE NEWS + SINGLE VISUAL PHONE AD SECTION ---------- */
    .iphone-news-section {
      background: var(--surface);
      color: var(--text);
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .iphone-news-section:lang(ar),
    [dir="rtl"] .iphone-news-section {
      direction: rtl;
      text-align: right;
    }

    .iphone-news-section:lang(fr),
    .iphone-news-section:lang(en),
    [dir="ltr"] .iphone-news-section {
      direction: ltr;
      text-align: left;
    }

    .iphone-news-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .iphone-news-title {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text);
    }

    .iphone-news-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .iphone-news-badge {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .iphone-refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, opacity 0.2s ease;
    }

    .iphone-refresh-btn:hover:not(:disabled) {
      background: var(--surface-3);
      border-color: var(--accent);
      color: var(--accent);
    }

    .iphone-refresh-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .iphone-refresh-icon {
      display: inline-block;
      line-height: 1;
      font-size: 0.92rem;
    }

    .iphone-refresh-btn.is-loading .iphone-refresh-icon {
      animation: iphoneNewsSpin 0.8s linear infinite;
    }

    @keyframes iphoneNewsSpin {
      to { transform: rotate(360deg); }
    }

    .news-frame-slot {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      min-height: 0;
    }

    @media (min-width: 560px) {
      .news-frame-slot {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .news-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      align-content: start;
    }

    .news-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
      min-width: 0;
      transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .news-card:hover {
      transform: translateY(-1px);
      background: var(--surface-3);
      border-color: var(--accent);
    }

    .news-card h3 {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.4;
      font-weight: 700;
    }

    .news-card a {
      color: var(--text);
      text-decoration: none;
    }

    .news-card a:hover {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .news-card time {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .news-status {
      margin: 0;
      padding: 6px 4px;
      text-align: center;
      font-size: 0.84rem;
      color: var(--muted);
    }

    /* ---------- SINGLE VISUAL PHONE AD COLUMN ---------- */
    .phone-ads-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .phone-ads-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 0 2px;
    }

    .phone-ads-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text);
    }

    .phone-ad-pill {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--badge-text);
      background: var(--badge-bg);
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .phone-ad-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s ease, transform 0.18s ease;
    }

    .phone-ad-card:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .phone-ad-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--muted);
    }

    .phone-ad-source {
      color: var(--gold);
    }

    .phone-ad-visual {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface-3);
    }

    .phone-ad-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .phone-ad-card h4 {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.4;
    }

    .phone-ad-card p {
      margin: 0;
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--muted);
    }

    .phone-ad-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .phone-ad-link {
      font-size: 0.78rem;
      font-weight: 800;
      color: #60a5fa;
      text-decoration: none;
    }

    [data-theme="light"] .phone-ad-link {
      color: var(--accent);
    }

    .phone-ad-link:hover {
      text-decoration: underline;
    }

    .phone-ad-dl-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .phone-ad-dl-btn:hover {
      border-color: var(--gold);
      background: var(--gold-soft);
    }

    /* ---------- MESSAGES ---------- */
    .msg {
      margin-top: 14px;
      font-size: 1rem;
      font-weight: 700;
    }

    .msg.err  { color: var(--err); }
    .msg.ok   { color: var(--ok); }
    .msg.warn { color: var(--warn); }

    /* ---------- RESULT ---------- */
    .result-panel {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      animation: fadeIn 0.3s ease;
    }

    .result-panel.visible { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-summary {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 14px 16px;
      font-size: 1.02rem;
      margin-bottom: 12px;
      font-family: var(--mono);
      word-break: break-all;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .result-actions > * {
      flex: 1;
      min-width: 120px;
      min-height: 46px;
      justify-content: center;
    }

    .copy-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 14px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.2s ease;
    }

    .copy-btn:hover { border-color: var(--accent); }

    /* ---------- SERVICES ---------- */
    .services-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
      flex: 1;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .service-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .service-item:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .service-item.featured {
      border-color: rgba(37, 99, 235, 0.58);
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.1) 0%, var(--surface-2) 100%);
    }

    .service-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px 10px;
      margin-bottom: 10px;
      max-width: 100%;
      min-width: 0;
    }

    .service-name {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.4;
      min-width: 0;
      max-width: 100%;
    }

    .badges-wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      min-width: 0;
      flex-shrink: 0;
    }

    .badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.84rem;
      font-weight: 800;
      padding: 4px 11px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .badge-pro {
      background: rgba(37, 99, 235, 0.2);
      color: #60a5fa;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 4px 11px;
      border-radius: 999px;
      white-space: nowrap;
    }

    [data-theme="light"] .badge-pro {
      color: var(--accent);
    }

    .service-desc {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.68;
      margin-bottom: 18px;
      min-width: 0;
    }

    .wa-btn {
      width: 100%;
      min-height: 50px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1.02rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .wa-btn:hover {
      border-color: #25d366;
      background: rgba(37, 211, 102, 0.14);
    }

    .service-item.featured .wa-btn {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .service-item.featured .wa-btn:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* ---------- 6. FOOTER & SOCIAL ICONS ---------- */
    .footer-box {
      order: 4;
      text-align: center;
      margin-top: 26px;
      padding: 24px 20px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      font-size: 0.96rem;
      color: var(--muted);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 100%;
      min-width: 0;
    }

    .footer-top-row {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .social-icons-only {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .sc-icon {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .sc-icon:hover {
      transform: translateY(-2px);
      color: #ffffff;
      border-color: transparent;
    }

    .sc-icon:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .sc-icon::after {
      content: attr(data-label);
      position: absolute;
      bottom: calc(100% + 7px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: var(--surface-3);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      padding: 6px 10px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .sc-icon:hover::after,
    .sc-icon:focus-visible::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .sc-wa:hover { background-color: #25d366; }
    .sc-fb:hover { background-color: #1877f2; }
    .sc-tt:hover { background-color: #111827; border-color: #334155; }
    .sc-tg:hover { background-color: #0088cc; }
    .sc-gm:hover { background-color: #ea4335; }

    .footer-pills {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .footer-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 46px;
      padding: 9px 16px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .footer-pill:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .footer-bottom-row {
      width: 100%;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .legal-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px 14px;
    }

    .legal-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 600;
      white-space: nowrap;
      transition: color 0.15s ease;
    }

    .legal-links a:hover { color: var(--text); text-decoration: underline; }
    .legal-sep { color: var(--border); }

    .copyright-line {
      font-size: 0.92rem;
      color: var(--muted);
    }

    /* ---------- TOAST ---------- */
    .toast-container {
      position: fixed;
      bottom: 20px;
      inset-inline-end: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1020;
      max-width: calc(100vw - 40px);
    }

    .toast {
      background: var(--surface-3);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 13px 18px;
      font-size: 0.96rem;
      font-weight: 700;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 230px;
      animation: slideIn 0.3s ease;
    }

    .toast.ok   { border-inline-start: 4px solid var(--ok); }
    .toast.err  { border-inline-start: 4px solid var(--err); }
    .toast.warn { border-inline-start: 4px solid var(--warn); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    [dir="rtl"] .toast { animation-name: slideInRtl; }
    @keyframes slideInRtl {
      from { opacity: 0; transform: translateX(-20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ---------- MODALS ---------- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 980;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.visible { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      max-width: 540px;
      width: 100%;
      max-height: 82vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .modal h3 { font-size: 1.2rem; }

    .clear-btn {
      background: transparent;
      color: var(--err);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 13px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .clear-btn:hover { border-color: var(--err); }
