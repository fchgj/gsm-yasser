<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة - GSM Yasser</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    .card { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    button { padding: 8px 14px; cursor: pointer; }
    pre { background: #eee; padding: 10px; overflow: auto; direction: ltr; text-align: left; }
  </style>
</head>
<body>
  <h2>لوحة الإدارة</h2>

  <div class="card">
    <label>رابط الـ Worker:</label>
    <input id="workerUrl" type="text" placeholder="https://your-worker.workers.dev" style="width: 300px;" />
    <input id="adminToken" type="password" placeholder="ADMIN_TOKEN (اختياري)" />
    <button onclick="loadState()">تحميل البيانات</button>
  </div>

  <div class="card">
    <h3>البيانات الحالية</h3>
    <pre id="output">في انتظار التحميل...</pre>
  </div>

  <script>
    async function loadState() {
      const baseUrl = document.getElementById("workerUrl").value.trim().replace(/\/+$/, "");
      const token = document.getElementById("adminToken").value.trim();
      const output = document.getElementById("output");

      if (!baseUrl) {
        output.textContent = "يرجى إدخال رابط الـ Worker أولاً.";
        return;
      }

      const headers = {};
      if (token) headers["Authorization"] = `Bearer ${token}`;

      try {
        const res = await fetch(`${baseUrl}/api/state`, { headers });
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = "خطأ في الاتصال: " + err.message;
      }
    }
  </script>
</body>
  </html>
