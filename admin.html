<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - GSMYasser Server</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 980px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h1, h2 { margin-top: 0; color: #38bdf8; }
    .login-card { max-width: 420px; margin: 60px auto; }
    .pass-wrap { position: relative; margin: 12px 0; }
    input[type="password"], input[type="text"] {
      width: 100%; padding: 12px 68px 12px 12px; border-radius: 8px;
      border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px;
    }
    .toggle-eye {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: transparent; color: #94a3b8; padding: 4px 8px; font-size: 13px;
    }
    button {
      padding: 10px 18px; border: none; border-radius: 8px;
      cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: #0284c7; color: #fff; width: 100%; padding: 12px; }
    .btn-primary:hover:not(:disabled) { background: #0369a1; }
    .btn-refresh { background: #10b981; color: #fff; }
    .btn-refresh:hover:not(:disabled) { background: #059669; }
    .btn-logout { background: #475569; color: #fff; }
    .btn-logout:hover:not(:disabled) { background: #334155; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }
    .btn-del-one { background: #dc2626; color: #fff; padding: 6px 10px; font-size: 12px; }
    .toolbar { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 15px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; vertical-align: middle; }
    th { background: #0f172a; color: #38bdf8; }
    .badge {
      background: #334155; color: #e2e8f0; padding: 4px 8px;
      border-radius: 6px; font-family: monospace; display: inline-block;
    }
    .empty { text-align: center; padding: 30px; color: #94a3b8; }
    .hidden { display: none; }
