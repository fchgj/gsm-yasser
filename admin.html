<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vérification IMEI - gsm-yasser</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #080e1c;
      --card: #11192c;
      --input-bg: #1b2438;
      --pill-bg: #151e33;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent-link: #60a5fa;
      --check-badge: #84cc16;
      --border: #233047;
      --error: #f87171;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.28);
    }

    :root[data-theme="light"] {
      --bg: #f1f5f9;
      --card: #ffffff;
      --input-bg: #f8fafc;
      --pill-bg: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent-link: #0284c7;
      --check-badge: #65a30d;
      --border: #cbd5e1;
      --error: #dc2626;
      --shadow: 0 8px 20px rgba(15, 23, 42, 0.07);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 16px 14px 48px;
    }

    /* Top Bar: Languages, Steps Icon Shortcut & Theme */
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .right-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .lang-pills {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background-color: var(--pill-bg);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .lang-btn {
      background: transparent;
      color: var(--text);
      border: none;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .lang-btn.active {
      background-color: var(--primary);
      color: #ffffff;
    }

    .steps-icon-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--pill-bg);
      color: var(--accent-link);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .steps-icon-link:hover {
      border-color: var(--primary);
      background-color: rgba(37, 99, 235, 0.12);
    }

    .theme-btn {
      background-color: var(--pill-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .theme-btn:hover {
      border-color: var(--primary);
    }

    /* Hero */
    .hero {
      text-align: center;
      margin-bottom: 20px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ef4444, #f8fafc);
      color: #0f172a;
      font-weight: 900;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .hero h1 {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 800;
    }

    .hero p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* Cards */
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .free-header {
      text-align: center;
      margin-bottom: 14px;
    }

    .free-header h2 {
      margin: 0;
      font-size: 1.18rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .check-badge {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background-color: var(--check-badge);
      color: #0f172a;
      font-size: 0.85rem;
      font-weight: 900;
    }

    .free-header p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .imei-input {
      width: 100%;
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.95rem;
      text-align: center;
      letter-spacing: 0.04em;
    }

    .imei-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .captcha-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      margin-top: 10px;
    }

    .captcha-label {
      font-size: 0.82rem;
      color: var(--text);
      font-weight: 600;
    }

    .captcha-code-box {
      background-color: #ffffff;
      color: #1e293b;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 0.14em;
      padding: 4px 10px;
      border-radius: 6px;
      user-select: none;
    }

    .captcha-input {
      width: 80px;
      background-color: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.88rem;
      text-align: center;
      text-transform: uppercase;
    }

    .captcha-refresh {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 7px;
      width: 30px;
      height: 30px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-full {
      width: 100%;
      margin-top: 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
