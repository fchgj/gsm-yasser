<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPhone IMEI Lookup &amp; PDF Report Generator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #082f49;
      --whatsapp: #22c55e;
      --whatsapp-dark: #052e16;
      --border: #334155;
      --error: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 18px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .nav-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .nav-link:hover {
      background-color: rgba(56, 189, 248, 0.1);
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1 1 240px;
      background-color: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      letter-spacing: 0.06em;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--accent-dark);
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary:hover {
      filter: brightness(1.06);
    }

    .help-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .help-link:hover {
      background-color: rgba(56, 189, 248, 0.1);
      text-decoration: underline;
    }

    .helper-text {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .error-msg {
      margin: 10px 0 0;
      color: var(--error);
      font-size: 0.88rem;
      min-height: 1.2em;
    }

    .result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background-color: var(--bg);
      border: 1px solid var(--border);
    }

    .result-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .result-header h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .btn-pdf {
      background-color: #e2e8f0;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    .support-bar {
      margin-top: 24px;
      padding: 16px 18px;
      border-radius: 14px;
      background-color: var(--card);
      border: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .support-info p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--whatsapp);
      color: var(--whatsapp-dark);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 10px 16px;
      border-radius: 10px;
    }

    .btn-whatsapp:hover {
      filter: brightness(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>iPhone IMEI Lookup</h1>
        <p>Check device IMEI details and generate an instant PDF report.</p>
      </div>
      <a href="steps.html" class="nav-link">Usage Steps</a>
    </header>

    <main class="card">
      <form id="imei-form" novalidate>
        <label for="imei-input">Enter 15-digit iPhone IMEI</label>
        <div class="input-row">
          <input
            type="text"
            id="imei-input"
            name="imei"
            inputmode="numeric"
            maxlength="15"
            placeholder="e.g. 350000000000000"
            autocomplete="off"
          />
        </div>

        <p class="helper-text">Dial <strong>*#06#</strong> on your iPhone to view the IMEI number.</p>
        <p id="imei-error" class="error-msg" role="alert"></p>

        <div class="form-actions">
          <button type="submit" id="check-btn" class="btn-primary">Lookup &amp; Generate Report</button>
          <a href="steps.html" class="help-link">How to use this tool? (Steps)</a>
        </div>
      </form>

      <section id="result-box" class="result-box" hidden aria-live="polite">
        <div class="result-header">
          <h2>IMEI Report Preview</h2>
          <button type="button" id="download-pdf-btn" class="btn-pdf">Download PDF</button>
        </div>
        <div id="result-content"></div>
      </section>
    </main>

    <aside class="support-bar" aria-label="Customer Support">
      <div class="support-info">
        <strong>Need help via WhatsApp?</strong>
        <p>Support number: <a href="https://wa.me/213657241710" target="_blank" rel="noopener noreferrer" style="color: var(--accent); text-decoration: none;">+213 657 241 710</a></p>
      </div>
      <a
        href="https://wa.me/213657241710?text=Hello%2C%20I%20need%20help%20with%20iPhone%20IMEI%20lookup."
        target="_blank"
        rel="noopener noreferrer"
        class="btn-whatsapp"
      >
        Chat on WhatsApp (+213657241710)
      </a>
    </aside>
  </div>

  <script src="generator.js"></script>
  <script>
    (function () {
      const form = document.getElementById("imei-form");
      const input = document.getElementById("imei-input");
      const errorEl = document.getElementById("imei-error");
      const resultBox = document.getElementById("result-box");
      const resultContent = document.getElementById("result-content");
      const downloadPdfBtn = document.getElementById("download-pdf-btn");

      let latestReportData = null;

      function isValidImei(value) {
        if (!/^\d{15}$/.test(value)) return false;
        let sum = 0;
        for (let i = 0; i < 15; i++) {
          let digit = Number(value[i]);
          if (i % 2 === 1) {
            digit *= 2;
            if (digit > 9) digit -= 9;
          }
          sum += digit;
        }
        return sum % 10 === 0;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        errorEl.textContent = "";
        const imei = input.value.trim().replace(/\s+/g, "");

        if (!isValidImei(imei)) {
          errorEl.textContent = "Please enter a valid 15-digit IMEI number.";
          return;
        }

        const report =
          window.Generator && typeof window.Generator.lookupImei === "function"
            ? await window.Generator.lookupImei(imei)
            : {
                imei,
                status: "Ready for report",
                generatedAt: new Date().toISOString()
              };

        latestReportData = report;
        resultContent.innerHTML =
          "<p><strong>IMEI:</strong> " + report.imei + "</p>" +
          "<p><strong>Status:</strong> " + (report.status || "Checked") + "</p>" +
          "<p><strong>Timestamp:</strong> " + (report.generatedAt || new Date().toLocaleString()) + "</p>";
        resultBox.hidden = false;
      });

      downloadPdfBtn.addEventListener("click", function () {
        if (!latestReportData) return;
        if (window.Generator && typeof window.Generator.generatePdf === "function") {
          window.Generator.generatePdf(latestReportData);
        } else {
          window.print();
        }
      });
    })();
  </script>
</body>
</html>
