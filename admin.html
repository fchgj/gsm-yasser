<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة - GSM Yasser</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #222; }
    .box { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    input, select, button { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { background: #0f172a; color: #fff; border: none; cursor: pointer; }
    button.secondary { background: #2563eb; }
    button.success { background: #16a34a; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: right; }
    th { background: #f8fafc; }
    .status { font-weight: bold; color: #2563eb; }
  </style>
</head>
<body>
  <div class="box">
    <h2>لوحة الإدارة - GSM Yasser</h2>
    <div class="row">
      <input id="workerUrl" type="url" placeholder="https://your-worker.workers.dev" style="min-width:260px; flex:1;" />
      <input id="adminToken" type="password" placeholder="ADMIN_TOKEN (اختياري)" />
      <button class="secondary" onclick="pullState()">جلب البيانات</button>
      <button class="success" onclick="pushSync()">مزامنة إلى D1</button>
    </div>
    <div id="msg" class="status">جاهز</div>
  </div>

  <div class="box">
    <h3>إضافة طلب (IMEI)</h3>
    <div class="row">
      <input id="oClient" type="text" placeholder="اسم العميل" />
      <input id="oPhone" type="text" placeholder="رقم الهاتف" />
      <input id="oImei" type="text" placeholder="رقم IMEI (15 رقم)" maxlength="15" />
      <input id="oService" type="text" placeholder="اسم الخدمة" />
      <input id="oPrice" type="number" placeholder="السعر" step="any" />
      <select id="oStatus">
        <option value="pending">قيد الانتظار</option>
        <option value="processing">قيد التنفيذ</option>
        <option value="completed">مكتمل</option>
        <option value="rejected">مرفوض</option>
      </select>
      <button onclick="addOrder()">إضافة للقائمة</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>العميل</th><th>الهاتف</th><th>IMEI</th><th>الخدمة</th><th>السعر</th><th>الحالة</th>
        </tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
  </div>

  <script>
    let state = { orders: [], clients: [], services: [] };

    const urlInput = document.getElementById("workerUrl");
    const tokenInput = document.getElementById("adminToken");
    urlInput.value = localStorage.getItem("gsm_worker_url") || "";
    tokenInput.value = localStorage.getItem("gsm_admin_token") || "";

    function saveConfig() {
      localStorage.setItem("gsm_worker_url", urlInput.value.trim().replace(/\/+$/, ""));
      localStorage.setItem("gsm_admin_token", tokenInput.value.trim());
    }

    function getHeaders(json = false) {
      saveConfig();
      const h = {};
      if (json) h["Content-Type"] = "application/json";
      const t = tokenInput.value.trim();
      if (t) h["Authorization"] = `Bearer ${t}`;
      return h;
    }

    function renderOrders() {
      const tbody = document.getElementById("ordersBody");
      tbody.innerHTML = state.orders.map(o => `
        <tr>
          <td>${o.id}</td>
          <td>${o.clientName || ""}</td>
          <td>${o.clientPhone || ""}</td>
          <td>${o.imei || ""}</td>
          <td>${o.serviceName || ""}</td>
          <td>${Number(o.price || 0)}</td>
          <td>${o.status || "pending"}</td>
        </tr>
      `).join("");
    }

    function addOrder() {
      const clientName = document.getElementById("oClient").value.trim();
      const clientPhone = document.getElementById("oPhone").value.trim();
      const imei = document.getElementById("oImei").value.trim();
      const serviceName = document.getElementById("oService").value.trim();
      const price = Number(document.getElementById("oPrice").value || 0);
      const status = document.getElementById("oStatus").value;

      if (!clientName || !imei || !serviceName) {
        document.getElementById("msg").textContent = "يرجى إدخال اسم العميل و IMEI واسم الخدمة.";
        return;
      }

      const nextId = state.orders.length ? Math.max(...state.orders.map(x => Number(x.id) || 0)) + 1 : 1;
      state.orders.unshift({
        id: nextId,
        clientName,
        clientPhone,
        imei,
        serviceName,
        price,
        status,
        createdAt: new Date().toISOString()
      });

      renderOrders();
      document.getElementById("msg").textContent = "تمت الإضافة محلياً — اضغط (مزامنة إلى D1) لحفظها.";
    }

    async function pullState() {
      const base = urlInput.value.trim().replace(/\/+$/, "");
      if (!base) return (document.getElementById("msg").textContent = "أدخل رابط الـ Worker أولاً.");
      document.getElementById("msg").textContent = "جاري جلب البيانات...";
      try {
        const res = await fetch(`${base}/api/state`, { headers: getHeaders() });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        state = {
          orders: Array.isArray(data.orders) ? data.orders : [],
          clients: Array.isArray(data.clients) ? data.clients : [],
          services: Array.isArray(data.services) ? data.services : []
        };
        renderOrders();
        document.getElementById("msg").textContent = "تم جلب البيانات بنجاح.";
      } catch (e) {
        document.getElementById("msg").textContent = "خطأ: " + e.message;
      }
    }

    async function pushSync() {
      const base = urlInput.value.trim().replace(/\/+$/, "");
      if (!base) return (document.getElementById("msg").textContent = "أدخل رابط الـ Worker أولاً.");
      document.getElementById("msg").textContent = "جاري المزامنة...";
      try {
        const res = await fetch(`${base}/api/sync`, {
          method: "POST",
          headers: getHeaders(true),
          body: JSON.stringify(state)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        document.getElementById("msg").textContent = "تمت المزامنة مع قاعدة D1 بنجاح.";
      } catch (e) {
        document.getElementById("msg").textContent = "خطأ في المزامنة: " + e.message;
      }
    }
  </script>
</body>
</html>
