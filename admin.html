<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vérification IMEI - gsm-yasser</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #080e1c;
      --card: #11192c;
      --input-bg: #1b2438;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --pill-bg: #151e33;
      --border: #1e293b;
      --error: #f87171;
      --whatsapp: #16a34a;
    }

    :root[data-theme="light"] {
      --bg: #f1f5f9;
      --card: #ffffff;
      --input-bg: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --pill-bg: #e2e8f0;
      --border: #cbd5e1;
      --error: #dc2626;
      --whatsapp: #16a34a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 16px 14px 48px;
    }

    /* Top Bar (Languages + Theme) */
    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .lang-pills {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--pill-bg);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .lang-btn {
      background: transparent;
      color: var(--text);
      border: none;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .lang-btn.active {
      background-color: var(--primary);
      color: #ffffff;
    }

    .theme-btn {
      background-color: var(--pill-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Hero Title */
    .hero {
      text-align: center;
      margin-bottom: 20px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ef4444, #f8fafc);
      color: #0f172a;
      font-weight: 900;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .hero h1 {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 800;
    }

    .hero p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* Cards */
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .free-header {
      text-align: center;
      margin-bottom: 14px;
    }

    .free-header h2 {
      margin: 0;
      font-size: 1.18rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .check-badge {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background-color: #84cc16;
      color: #0f172a;
      font-size: 0.85rem;
      font-weight: 900;
    }

    .free-header p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .imei-input {
      width: 100%;
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.95rem;
      text-align: center;
      letter-spacing: 0.04em;
    }

    .imei-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Captcha Box */
    .captcha-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      margin-top: 10px;
    }

    .captcha-label {
      font-size: 0.82rem;
      color: var(--text);
      font-weight: 600;
    }

    .captcha-code-box {
      background-color: #ffffff;
      color: #1e293b;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 0.14em;
      padding: 4px 10px;
      border-radius: 6px;
      user-select: none;
    }

    .captcha-input {
      width: 78px;
      background-color: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.88rem;
      text-align: center;
      text-transform: uppercase;
    }

    .captcha-refresh {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 7px;
      width: 30px;
      height: 30px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-full {
      width: 100%;
      margin-top: 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      transition: background-color 0.2s ease;
    }

    .btn-full:hover {
      background-color: var(--primary-hover);
    }

    .error-msg {
      margin: 8px 0 0;
      color: var(--error);
      font-size: 0.85rem;
      text-align: center;
      min-height: 1.1em;
    }

    .result-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .result-box p {
      margin: 4px 0;
    }

    /* Service Cards */
    .service-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .shield-icon {
      flex: 0 0 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #ef4444, #f8fafc);
      color: #0f172a;
      font-size: 0.78rem;
      font-weight: 900;
      display: grid;
      place-items: center;
      margin-top: 2px;
    }

    .service-head h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .service-head p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    /* Numbered Quick Steps & Footer Links */
    .steps-mini {
      margin-top: 20px;
    }

    .steps-mini-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .steps-mini-head h2 {
      margin: 0;
      font-size: 1rem;
    }

    .link-accent {
      color: #60a5fa;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .link-accent:hover {
      text-decoration: underline;
    }

    .steps-list {
      display: grid;
      gap: 10px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.86rem;
    }

    .step-num {
      flex: 0 0 26px;
      height: 26px;
      border-radius: 50%;
      background-color: var(--primary);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.82rem;
      display: grid;
      place-items: center;
    }

    .footer-nav {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.84rem;
    }

    .footer-nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
  </style>
</head>
<body id="top">
  <div class="container">
    <!-- Top Language & Theme Bar -->
    <div class="top-controls">
      <div class="lang-pills" role="group" aria-label="Language Selector">
        <button type="button" class="lang-btn" data-lang="ar">العربية</button>
        <button type="button" class="lang-btn active" data-lang="fr">FR</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
      <button type="button" id="theme-toggle" class="theme-btn">☀️ Clair</button>
    </div>
