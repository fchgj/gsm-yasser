<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - GSMYasser Server</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 1020px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h1, h2 { margin-top: 0; color: #38bdf8; }
    .login-card { max-width: 420px; margin: 60px auto; }
    .pass-wrap { position: relative; margin: 12px 0; }
    input[type="password"], input[type="text"] {
      width: 100%; padding: 12px 68px 12px 12px; border-radius: 8px;
      border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px;
    }
    .toggle-eye {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: transparent; color: #94a3b8; padding: 4px 8px; font-size: 13px;
    }
    button, .btn-link {
      padding: 10px 16px; border: none; border-radius: 8px; text-decoration: none;
      cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; display: inline-block;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: #0284c7; color: #fff; width: 100%; padding: 12px; }
    .btn-primary:hover:not(:disabled) { background: #0369a1; }
    .btn-refresh { background: #10b981; color: #fff; }
    .btn-refresh:hover:not(:disabled) { background: #059669; }
    .btn-whatsapp-top { background: #16a34a; color: #fff; }
    .btn-whatsapp-top:hover { background: #15803d; }
    .btn-logout { background: #475569; color: #fff; }
    .btn-logout:hover:not(:disabled) { background: #334155; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }
    .btn-wa { background: #22c55e; color: #052e16; padding: 6px 10px; font-size: 12px; }
    .btn-wa:hover { background: #16a34a; color: #fff; }
    .btn-del-one { background: #dc2626; color: #fff; padding: 6px 10px; font-size: 12px; }
    .toolbar { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 15px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; vertical-align: middle; }
    th { background: #0f172a; color: #38bdf8; }
    .badge {
      background: #334155; color: #e2e8f0; padding: 4px 8px;
      border-radius: 6px; font-family: monospace; display: inline-block;
    }
    .empty { text-align: center; padding: 30px; color: #94a3b8; }
    .hidden { display: none; }
    .error-msg { color: #f87171; font-size: 13px; margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Screen -->
    <div id="loginBox" class="card login-card">
      <h2>Admin Login - GSMYasser</h2>
      <p style="color:#94a3b8; font-size:14px; margin-bottom:6px;">Enter the admin password to access IMEI orders:</p>
      <form onsubmit="handleLogin(event)">
        <div class="pass-wrap">
          <input type="password" id="adminPass" placeholder="Password" autocomplete="current-password" required />
          <button type="button" class="toggle-eye" onclick="togglePasswordVisibility()">Show</button>
        </div>
        <button type="submit" class="btn-primary">Sign In</button>
      </form>
      <p id="loginError" class="error-msg"></p>
    </div>

    <!-- Admin Dashboard -->
    <div id="dashboardBox" class="hidden">
      <div class="card">
        <div class="toolbar">
          <div>
            <h1 style="margin-bottom:4px;">iPhone IMEI Lookup Orders</h1>
            <small id="statusText" style="color:#94a3b8;">Ready to sync with cloud database</small>
          </div>
          <div class="actions">
            <a id="topWhatsappLink" href="#" target="_blank" rel="noopener noreferrer" class="btn-link btn-whatsapp-top">
              WhatsApp (0657.24.17.10)
            </a>
            <button type="button" id="refreshBtn" class="btn-refresh" onclick="loadOrders()">Refresh</button>
            <button type="button" id="clearAllBtn" class="btn-danger" onclick="clearOrders()">Clear All</button>
            <button type="button" class="btn-logout" onclick="logout()">Logout</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>IMEI Number</th>
                <th>Service / Details</th>
                <th>Date &amp; Time</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr><td colspan="5" class="empty">Loading orders...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DB_URL = "https://gsm-yasser-default-rtdb.firebaseio.com";
    const ADMIN_PASSWORD = "wP5t5B3d";
    const WHATSAPP_NUMBER = "213657241710"; // 0657.24.17.10
    const AUTH_KEY = "gsm_yasser_admin_session_en_wa_v1";

    function buildWhatsappUrl(messageText) {
      return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(messageText)}`;
    }

    function initTopWhatsappLink() {
      const link = document.getElementById("topWhatsappLink");
      if (link) {
        link.href = buildWhatsappUrl("Hello GSMYasser Server, I am following up on iPhone IMEI lookup orders.");
      }
    }

    function togglePasswordVisibility() {
      const input = document.getElementById("adminPass");
      const btn = document.querySelector(".toggle-eye");
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "Hide";
      } else {
        input.type = "password";
        btn.textContent = "Show";
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      const input = document.getElementById("adminPass");
      const err = document.getElementById("loginError");
      err.textContent = "";

      if (input.value === ADMIN_PASSWORD) {
        sessionStorage.setItem(AUTH_KEY, "authenticated");
        input.value = "";
        showDashboard();
      } else {
        err.textContent = "Invalid password.";
        input.focus();
      }
    }

    function logout() {
      sessionStorage.removeItem(AUTH_KEY);
      document.getElementById("dashboardBox").classList.add("hidden");
      document.getElementById("loginBox").classList.remove("hidden");
      document.getElementById("adminPass").value = "";
      document.getElementById("loginError").textContent = "";
    }

    function showDashboard() {
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("dashboardBox").classList.remove("hidden");
      initTopWhatsappLink();
      loadOrders();
    }

    function formatOrderDate(rawDate) {
      if (!rawDate) return "-";
      const parsed = new Date(rawDate);
      if (!Number.isNaN(parsed.getTime())) {
        return parsed.toLocaleString("en-GB", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
      }
      return String(rawDate);
    }

    async function loadOrders() {
      const tbody = document.getElementById("ordersTableBody");
      const status = document.getElementById("statusText");
      const refreshBtn = document.getElementById("refreshBtn");

      refreshBtn.disabled = true;
      status.textContent = "Syncing orders from Firebase...";

      try {
        const res = await fetch(`${DB_URL}/orders.json`, { cache: "no-store" });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();

        if (!data || typeof data !== "object") {
          tbody.innerHTML = '<tr><td colspan="5" class="empty">No orders found yet.</td></tr>';
          status.textContent = "Last updated: " + new Date().toLocaleTimeString("en-GB");
          return;
        }

        const entries = Object.entries(data)
          .filter(([, item]) => item && typeof item === "object")
          .sort((a, b) => {
            const ta = new Date(a[1].timestamp || a[1].date || 0).getTime();
            const tb = new Date(b[1].timestamp || b[1].date || 0).getTime();
            if (!Number.isNaN(ta) && !Number.isNaN(tb) && ta !== tb) {
              return tb - ta;
            }
            return 0;
          });

        if (entries.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty">No valid orders available.</td></tr>';
          status.textContent = "Last updated: " + new Date().toLocaleTimeString("en-GB");
          return;
        }

        tbody.innerHTML = entries.map(([id, item], index) => {
          const imeiText = String(item.imei || item.IMEI || "-");
          const serviceText = String(item.service || item.model || item.info || "iPhone IMEI Check");
          const formattedDate = formatOrderDate(item.timestamp || item.date);
          const waMessage = `Hello GSMYasser Server, Order #${index + 1} | IMEI: ${imeiText} | Service: ${serviceText}`;
          const waHref = buildWhatsappUrl(waMessage);

          return `
            <tr>
              <td>${index + 1}</td>
              <td><span class="badge">${escapeHtml(imeiText)}</span></td>
              <td>${escapeHtml(serviceText)}</td>
              <td>${escapeHtml(formattedDate)}</td>
              <td>
                <div class="row-actions">
                  <a href="${escapeHtml(waHref)}" target="_blank" rel="noopener noreferrer" class="btn-link btn-wa">WhatsApp</a>
                  <button type="button" class="btn-del-one" onclick="deleteOrder('${encodeURIComponent(id)}')">Delete</button>
                </div>
              </td>
            </tr>
          `;
        }).join("");

        status.textContent = `Total orders: ${entries.length} | Last updated: ${new Date().toLocaleTimeString("en-GB")}`;
      } catch (error) {
        console.error("Load orders error:", error);
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="empty" style="color:#f87171;">
              Failed to load orders. Check your network connection or Firebase Realtime Database security rules.
            </td>
          </tr>
        `;
        status.textContent = "Database connection error";
      } finally {
        refreshBtn.disabled = false;
      }
    }

    async function deleteOrder(encodedId) {
      if (!confirm("Are you sure you want to delete this order?")) return;

      const status = document.getElementById("statusText");
      try {
        const res = await fetch(`${DB_URL}/orders/${encodedId}.json`, {
          method: "DELETE"
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        await loadOrders();
      } catch (error) {
        console.error("Delete order error:", error);
        status.textContent = "Failed to delete order";
        alert("An error occurred while deleting the order.");
      }
    }

    async function clearOrders() {
      if (!confirm("This will permanently delete all orders from the database. Continue?")) return;

      const clearBtn = document.getElementById("clearAllBtn");
      const status = document.getElementById("statusText");
      clearBtn.disabled = true;

      try {
        const res = await fetch(`${DB_URL}/orders.json`, {
          method: "DELETE"
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        await loadOrders();
      } catch (error) {
        console.error("Clear orders error:", error);
        status.textContent = "Failed to clear orders";
        alert("An error occurred while clearing all orders.");
      } finally {
        clearBtn.disabled = false;
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    initTopWhatsappLink();
    if (sessionStorage.getItem(AUTH_KEY) === "authenticated") {
      showDashboard();
    }
  </script>
</body>
</html>
