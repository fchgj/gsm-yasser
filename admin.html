<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vérification IMEI - gsm-yasser</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #080e1c;
      --card: #11192c;
      --input-bg: #1b2438;
      --pill-bg: #151e33;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent-link: #60a5fa;
      --check-badge: #84cc16;
      --border: #233047;
      --error: #f87171;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.28);
    }

    :root[data-theme="light"] {
      --bg: #f1f5f9;
      --card: #ffffff;
      --input-bg: #f8fafc;
      --pill-bg: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent-link: #0284c7;
      --check-badge: #65a30d;
      --border: #cbd5e1;
      --error: #dc2626;
      --shadow: 0 8px 20px rgba(15, 23, 42, 0.07);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 16px 14px 48px;
    }

    /* Top Bar: Languages, Steps Icon Shortcut & Theme */
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .right-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .lang-pills {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background-color: var(--pill-bg);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .lang-btn {
      background: transparent;
      color: var(--text);
      border: none;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .lang-btn.active {
      background-color: var(--primary);
      color: #ffffff;
    }

    .steps-icon-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--pill-bg);
      color: var(--accent-link);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .steps-icon-link:hover {
      border-color: var(--primary);
      background-color: rgba(37, 99, 235, 0.12);
    }

    .theme-btn {
      background-color: var(--pill-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .theme-btn:hover {
      border-color: var(--primary);
    }

    /* Hero */
    .hero {
      text-align: center;
      margin-bottom: 20px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ef4444, #f8fafc);
      color: #0f172a;
      font-weight: 900;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .hero h1 {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 800;
    }

    .hero p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* Free Check Card */
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .free-header {
      text-align: center;
      margin-bottom: 14px;
    }

    .free-header h2 {
      margin: 0;
      font-size: 1.18rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .check-badge {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background-color: var(--check-badge);
      color: #0f172a;
      font-size: 0.85rem;
      font-weight: 900;
    }

    .free-header p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .imei-input {
      width: 100%;
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.95rem;
      text-align: center;
      letter-spacing: 0.04em;
    }

    .imei-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .captcha-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      margin-top: 10px;
    }

    .captcha-label {
      font-size: 0.82rem;
      color: var(--text);
      font-weight: 600;
    }

    .captcha-code-box {
      background-color: #ffffff;
      color: #1e293b;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 0.14em;
      padding: 4px 10px;
      border-radius: 6px;
      user-select: none;
    }

    .captcha-input {
      width: 80px;
      background-color: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.88rem;
      text-align: center;
      text-transform: uppercase;
    }

    .captcha-refresh {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 7px;
      width: 30px;
      height: 30px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-full {
      width: 100%;
      margin-top: 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-full:hover {
      background-color: var(--primary-hover);
    }

    .error-msg {
      margin: 8px 0 0;
      color: var(--error);
      font-size: 0.85rem;
      text-align: center;
      min-height: 1.1em;
    }

    .result-box {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .result-box p {
      margin: 4px 0;
    }

    /* Footer */
    .footer-bar {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.84rem;
    }

    .link-accent {
      color: var(--accent-link);
      text-decoration: none;
      font-weight: 600;
    }

    .link-accent:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body id="top">
  <div class="container">
    <!-- Top Controls: Languages + Workflow Icon Shortcut + Theme -->
    <div class="top-controls">
      <div class="lang-pills" role="group" aria-label="Language Selector">
        <button type="button" class="lang-btn" data-lang="ar">العربية</button>
        <button type="button" class="lang-btn active" data-lang="fr">FR</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>

      <div class="right-actions">
        <a href="steps.html" class="steps-icon-link" title="Workflow Steps" data-i18n-title="stepsTitle">
          <span aria-hidden="true">📋</span>
          <span data-i18n="stepsShortcut">Étapes</span>
        </a>
        <button type="button" id="theme-toggle" class="theme-btn">☀️ Clair</button>
      </div>
    </div>

    <!-- Header -->
    <header class="hero">
      <div class="hero-badge">U</div>
      <h1 data-i18n="heroTitle">Vérification IMEI</h1>
      <p data-i18n="heroSub">Vérifiez votre appareil facilement</p>
    </header>

    <!-- Free IMEI Check Card -->
    <main id="lookup-section" class="card">
      <div class="free-header">
        <h2>
          <span class="check-badge">✓</span>
          <span data-i18n="freeTitle">Vérification Gratuite</span>
        </h2>
        <p data-i18n="freeSub">Connaissez votre modèle - 100% Gratuit -</p>
      </div>

      <form id="imei-form" novalidate>
        <input
          type="text"
          id="imei-input"
          class="imei-input"
          inputmode="numeric"
          maxlength="15"
          placeholder="Entrez IMEI - 15 chiffres"
          autocomplete="off"
        />

        <div class="captcha-row">
          <span class="captcha-label" data-i18n="robotLabel">🔒 Je ne suis pas un robot:</span>
          <span id="captcha-code" class="captcha-code-box">NMKLU</span>
          <input type="text" id="captcha-input" class="captcha-input" maxlength="5" placeholder="Code" autocomplete="off" />
          <button type="button" id="captcha-refresh" class="captcha-refresh" title="Refresh">↻</button>
        </div>

        <p id="form-error" class="error-msg" role="alert"></p>

        <button type="submit" class="btn-full" data-i18n="freeBtn">Vérifier Gratuitement</button>
      </form>

      <div id="result-box" class="result-box" hidden aria-live="polite"></div>
    </main>

    <!-- Footer -->
    <footer class="footer-bar">
      <a
        id="wa-link"
        href="https://wa.me/213657241710?text=Bonjour%2C%20j%27ai%20besoin%20d%27aide%20pour%20la%20v%C3%A9rification%20IMEI."
        target="_blank"
        rel="noopener noreferrer"
        class="link-accent"
      >
        WhatsApp: +213 657 241 710
      </a>
      <a href="steps.html" class="link-accent">
        <span>📋</span> <span data-i18n="stepsShortcut">Étapes</span>
      </a>
    </footer>
  </div>

  <script src="generator.js"></script>
  <script>
    (function () {
      const WA_NUMBER = "213657241710";

      const translations = {
        fr: {
          dir: "ltr",
          title: "Vérification IMEI - gsm-yasser",
          heroTitle: "Vérification IMEI",
          heroSub: "Vérifiez votre appareil facilement",
          freeTitle: "Vérification Gratuite",
          freeSub: "Connaissez votre modèle - 100% Gratuit -",
          imeiPlaceholder: "Entrez IMEI - 15 chiffres",
          robotLabel: "🔒 Je ne suis pas un robot:",
          codePlaceholder: "Code",
          freeBtn: "Vérifier Gratuitement",
          stepsShortcut: "Étapes",
          stepsTitle: "Étapes de travail",
          themeLight: "☀️ Clair",
          themeDark: "🌙 Sombre",
          errImei: "Veuillez saisir un numéro IMEI valide à 15 chiffres.",
          errCaptcha: "Code de vérification incorrect.",
          lblImei: "IMEI",
          lblModel: "Modèle",
          lblStatus: "Statut",
          defaultModel: "iPhone",
          defaultStatus: "Vérifié gratuitement",
          waMsg: "Bonjour, j'ai besoin d'aide pour la vérification IMEI."
        },
        en: {
          dir: "ltr",
          title: "IMEI Check - gsm-yasser",
          heroTitle: "IMEI Check",
          heroSub: "Check your device easily",
          freeTitle: "Free Check",
          freeSub: "Know your model - 100% Free -",
          imeiPlaceholder: "Enter IMEI - 15 digits",
          robotLabel: "🔒 I am not a robot:",
          codePlaceholder: "Code",
          freeBtn: "Check for Free",
          stepsShortcut: "Steps",
          stepsTitle: "Workflow Steps",
          themeLight: "☀️ Light",
          themeDark: "🌙 Dark",
          errImei: "Please enter a valid 15-digit IMEI number.",
          errCaptcha: "Incorrect verification code.",
          lblImei: "IMEI",
          lblModel: "Model",
          lblStatus: "Status",
          defaultModel: "iPhone",
          defaultStatus: "Checked for free",
          waMsg: "Hello, I need help with IMEI check."
        },
        ar: {
          dir: "rtl",
          title: "فحص IMEI - gsm-yasser",
          heroTitle: "فحص رقم IMEI",
          heroSub: "تحقق من جهازك بسهولة",
          freeTitle: "فحص مجاني",
          freeSub: "اعرف طراز جهازك - مجاني 100% -",
          imeiPlaceholder: "أدخل رقم IMEI - 15 رقماً",
          robotLabel: "🔒 أنا لست روبوت:",
          codePlaceholder: "الكود",
          freeBtn: "فحص مجاناً",
          stepsShortcut: "الخطوات",
          stepsTitle: "خطوات العمل",
          themeLight: "☀️ فاتح",
          themeDark: "🌙 داكن",
          errImei: "يرجى إدخال رقم IMEI صحيح مكوّن من 15 رقماً.",
          errCaptcha: "رمز التحقق غير صحيح.",
          lblImei: "رقم IMEI",
          lblModel: "الطراز",
          lblStatus: "الحالة",
          defaultModel: "iPhone",
          defaultStatus: "تم الفحص مجاناً",
          waMsg: "مرحباً، أحتاج إلى مساعدة بخصوص فحص IMEI."
        }
      };

      const htmlEl = document.documentElement;
      const langBtns = document.querySelectorAll(".lang-btn");
      const themeToggle = document.getElementById("theme-toggle");
      const imeiInput = document.getElementById("imei-input");
      const captchaCodeEl = document.getElementById("captcha-code");
      const captchaInput = document.getElementById("captcha-input");
      const captchaRefresh = document.getElementById("captcha-refresh");
      const form = document.getElementById("imei-form");
      const formError = document.getElementById("form-error");
      const resultBox = document.getElementById("result-box");
      const waLink = document.getElementById("wa-link");

      let currentLang = localStorage.getItem("gsm_lang") || "fr";
      let currentTheme = localStorage.getItem("gsm_theme") || "dark";
      let generatedCaptcha = "NMKLU";
      let lastResult = null;

      function generateCaptcha() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let code = "";
        for (let i = 0; i < 5; i++) {
          code += chars[Math.floor(Math.random() * chars.length)];
        }
        generatedCaptcha = code;
        captchaCodeEl.textContent = code;
      }

      function renderResult(data) {
        if (!data) return;
        const dict = translations[currentLang] || translations.fr;
        resultBox.innerHTML =
          "<p><strong>" + dict.lblImei + ":</strong> " + data.imei + "</p>" +
          "<p><strong>" + dict.lblModel + ":</strong> " + (data.model || dict.defaultModel) + "</p>" +
          "<p><strong>" + dict.lblStatus + ":</strong> " + (data.status || dict.defaultStatus) + "</p>";
      }

      function applyTheme(theme) {
        currentTheme = theme === "light" ? "light" : "dark";
        htmlEl.setAttribute("data-theme", currentTheme);
        localStorage.setItem("gsm_theme", currentTheme);
        const dict = translations[currentLang] || translations.fr;
        themeToggle.textContent = currentTheme === "dark" ? dict.themeLight : dict.themeDark;
      }

      function applyLanguage(lang) {
        currentLang = translations[lang] ? lang : "fr";
        const dict = translations[currentLang];
        htmlEl.setAttribute("lang", currentLang);
        htmlEl.setAttribute("dir", dict.dir);
        document.title = dict.title;
        localStorage.setItem("gsm_lang", currentLang);

        langBtns.forEach((btn) => btn.classList.toggle("active", btn.dataset.lang === currentLang));

        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (dict[key]) el.textContent = dict[key];
        });

        document.querySelectorAll("[data-i18n-title]").forEach((el) => {
          const key = el.getAttribute("data-i18n-title");
          if (dict[key]) el.setAttribute("title", dict[key]);
        });

        imeiInput.placeholder = dict.imeiPlaceholder;
        captchaInput.placeholder = dict.codePlaceholder;
        themeToggle.textContent = currentTheme === "dark" ? dict.themeLight : dict.themeDark;
        waLink.href = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(dict.waMsg);

        if (!resultBox.hidden && lastResult) {
          renderResult(lastResult);
        }
      }

      function isValidImei(value) {
        if (!/^\d{15}$/.test(value)) return false;
        let sum = 0;
        for (let i = 0; i < 15; i++) {
          let digit = Number(value[i]);
          if (i % 2 === 1) {
            digit *= 2;
            if (digit > 9) digit -= 9;
          }
          sum += digit;
        }
        return sum % 10 === 0;
      }

      captchaRefresh.addEventListener("click", generateCaptcha);

      themeToggle.addEventListener("click", function () {
        applyTheme(currentTheme === "dark" ? "light" : "dark");
      });

      langBtns.forEach((btn) => {
        btn.addEventListener("click", function () {
          applyLanguage(btn.dataset.lang);
        });
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        formError.textContent = "";
        const dict = translations[currentLang] || translations.fr;
        const imei = imeiInput.value.trim().replace(/\s+/g, "");

        if (!isValidImei(imei)) {
          formError.textContent = dict.errImei;
          return;
        }

        if (captchaInput.value.trim().toUpperCase() !== generatedCaptcha) {
          formError.textContent = dict.errCaptcha;
          generateCaptcha();
          return;
        }

        const data =
          window.Generator && typeof window.Generator.lookupImei === "function"
            ? await window.Generator.lookupImei(imei)
            : {
                imei,
                model: dict.defaultModel,
                status: dict.defaultStatus
              };

        lastResult = data;
        renderResult(data);
        resultBox.hidden = false;
        generateCaptcha();
        captchaInput.value = "";
      });

      generateCaptcha();
      applyLanguage(currentLang);
      applyTheme(currentTheme);
    })();
  </script>
</body>
</html>
