<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">

  <style>
    :root {
      --bg: #070d1a;
      --surface: #0f172a;
      --surface-2: #162033;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #24324a;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.36);
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #0f172a;
      --muted: #334155;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #cbd5e1;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
      padding: 24px 16px 44px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 13px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .btn:hover {
      border-color: var(--accent);
    }

    .btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .meta {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 6px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 20px 0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 900;
    }

    h2 {
      font-size: 1.15rem;
      margin: 18px 0 8px;
      color: var(--text);
    }

    p {
      margin-bottom: 10px;
      color: var(--muted);
    }

    p strong, li strong {
      color: var(--text);
    }

    ul {
      padding-inline-start: 20px;
      margin-bottom: 12px;
      color: var(--muted);
    }

    li {
      margin-bottom: 6px;
    }

    .contact-link {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 700;
    }

    [data-theme="light"] .contact-link {
      color: var(--accent);
    }

    .contact-link:hover {
      text-decoration: underline;
    }

    .ltr-num {
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 22px;

</head>

    const tabButtons = document.querySelectorAll(".tab-btn");
    const panels = document.querySelectorAll(".panel");
    const langButtons = document.querySelectorAll("[data-lang]");
    let currentLang = localStorage.getItem(LANG_STORAGE_KEY) || "ar";

    function activateTab(tabName) {
      tabButtons.forEach((btn) => {
        const isActive = btn.dataset.tab === tabName;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-selected", String(isActive));
      });
      panels.forEach((panel) => {
        panel.classList.toggle("active", panel.id === tabName);
      });
    }

    function applyLang(lang) {
      currentLang = LEGAL_I18N[lang] ? lang : "ar";
      const pack = LEGAL_I18N[currentLang];
      document.documentElement.lang = currentLang;
      document.documentElement.dir = pack.dir;
      document.title = pack.docTitle;

      document.getElementById("pageTitle").textContent = pack.pageTitle;
      document.getElementById("pageMeta").textContent = pack.pageMeta;
      document.getElementById("tabPrivacy").textContent = pack.tabPrivacy;
      document.getElementById("tabTerms").textContent = pack.tabTerms;
      document.getElementById("tabDisclaimer").textContent = pack.tabDisclaimer;
      document.getElementById("backHomeBtn").textContent = pack.backHome;
      document.getElementById("footerText").innerHTML = pack.footer;

      document.getElementById("privacy").innerHTML = pack.privacyHtml;
      document.getElementById("terms").innerHTML = pack.termsHtml;
      document.getElementById("disclaimer").innerHTML = pack.disclaimerHtml;

      langButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === currentLang);
      });

      localStorage.setItem(LANG_STORAGE_KEY, currentLang);
    }

    tabButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const target = btn.dataset.tab;
        activateTab(target);
        history.replaceState(null, "", "#" + target);
      });
    });

    langButtons.forEach((btn) => {
      btn.addEventListener("click", () => applyLang(btn.dataset.lang));
    });

    function syncFromHash() {
      const hash = window.location.hash.replace("#", "");
      if (["privacy", "terms", "disclaimer"].includes(hash)) {
        activateTab(hash);
      }
    }

    window.addEventListener("hashchange", syncFromHash);

    const themeToggle = document.getElementById("themeToggle");
    const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
    if (savedTheme === "light" || savedTheme === "dark") {
      document.documentElement.setAttribute("data-theme", savedTheme);
    }

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem(THEME_STORAGE_KEY, next);
    });

    applyLang(currentLang);
    syncFromHash();
  </script>
